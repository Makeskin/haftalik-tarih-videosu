# O Yıl Sen — konu kuyruğu. Haftalık görev sıradaki, henüz episodes/<slug>/script.yaml'ı olmayan konuyu alır.
# Sırayı değiştirebilir, yeni konu ekleyebilirsin. "notes" senaryoya yön verir.
queue:
  - slug: 1979-kuyrukta-beklemek
    title: "Eğer 1979'da Benzin ve Tüpgaz Kuyruğunda Bekleseydin?"
    notes: "Yokluk yılları: tüp ve benzin kuyruğu, benzin karnesi, karaborsa, elektrik kesintisi, uzayan okul tatili, 24 Ocak 1980."
  - slug: 1998-cep-telefonsuz-ogrenci
    title: "Eğer 1998'de Cep Telefonsuz Bir Öğrenci Olsaydın?"
    notes: "90'lar sonu: evden çıkınca dünyadan kopmak, ankesörlü kulübeler, manyetik kart ve jeton, saat verip buluşmak, Walkman'de kalemle kaset sarmak, sınıfta ilk Nokia 5110 ve Yılan oyunu, çevirmeli internet (146), mIRC ve ICQ, disketle ödev taşımak."
  - slug: 2001-internet-kafe
    title: "Eğer 2001'de Bir İnternet Kafe Müdavimi Olsaydın?"
    notes: "Bodrum kat kafeler, saatlik süre, Counter-Strike, mIRC, disket."
  - slug: 1999-deprem-gecesi
    title: "Eğer 17 Ağustos 1999 Gecesi Gölcük'te Uyansaydın?"
    notes: "Marmara Depremi: 03.02, karanlık merdivenler, komşuların enkaz kurtarması (%98), çöken telefon hatları, Tüpraş yangını, Yunan ekibi ve deprem diplomasisi, çadırkent, Düzce, prefabrik, Kapıdışarı 99, yapı denetimi ve DASK. Hassas konu: sembolik ve aile dostu görseller."
  - slug: 1986-gecekondudan-apartmana
    title: "Eğer 80'lerde Gecekondudan Apartmana Taşınsaydın?"
    notes: "Gecekondu sahibinin gözünden: 1968'de bir gecede kurulan ev, 1984 imar affı (2981) ve tapu tahsis belgesi, 1986 ıslah planı ve dört kat hakkı, kat karşılığı müteahhit, yıkım, kirada bekleyiş ve enflasyon, ilk kalorifer, Kat Mülkiyeti ve apartman toplantısı, bugün kentsel dönüşüm. Motif: incir."
