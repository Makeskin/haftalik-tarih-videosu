# O Yıl Sen — Bölüm 1: 1979 kuyrukları (üretim: Cloudflare FLUX)
title: Eğer 1979'da Benzin ve Tüpgaz Kuyruğunda Bekleseydin?
motif: 'Yok — bakkalın tek kelimelik cevabı; tekrar eden şaka: balkondaki boş tüp'
characters:
  SEN: a 35-year-old Istanbul office clerk and father, white round head, dot eyes, thin black mustache, brown 1970s suit jacket with wide lapels, mustard knitted vest, flared grey trousers
  ES: a 1970s Istanbul mother, white round head, dot eyes, short dark bob hair, orange floral house dress, olive green cardigan
  KIZ: an 8-year-old schoolgirl, white round head, dot eyes, two pigtails with white ribbons, black school smock with a white collar
  BAKKAL: a neighborhood grocer, white round head, dot eyes, grey mustache, white apron over a striped shirt, a pencil behind the ear
  SEN_YASLI: an 82-year-old grandfather, white round head, dot eyes, white mustache, grey flat cap, navy blue cardigan, round glasses
youtube:
  title: Eğer 1979'da Benzin ve Tüpgaz Kuyruğunda Bekleseydin?
  description: '1979. İstanbul''da bir kış sabahı, saat altı. Elinde boş bir tüp, önünde kırk kişi var. Tüpçünün kamyonu gelecek mi, belli değil.


    Bu videoda Türkiye''nin yokluk yıllarını senin gözünden yaşıyoruz: benzin karnesi, kilometrelerce araba kuyruğu, bakkalın tek kelimelik cevabı, tezgâh altı karaborsa, günde dört beş saat elektrik kesintisi, paltoyla mesai, haftalarca kapalı okullar — ve 24 Ocak 1980 akşamı bir gecede değişen fiyatlar.


    Senin ailende o kuyruklarda bekleyen biri var mı? En uzun hangi kuyrukta beklemişler? Hikâyesini yorumlara yaz.


    Not: Anlatılan aile kurmacadır; tarihler ve rakamlar aşağıdaki kaynaklara dayanır. Görseller ve seslendirme yapay zekâ ile üretilmiştir.

    '
