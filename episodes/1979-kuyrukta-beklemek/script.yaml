sections:
- title: '1979: Sıraya Giriyorsun'
  scenes:
  - say: Bin dokuz yüz yetmiş dokuz.
    image: 'Wide establishing shot of a 1970s Istanbul neighborhood street before dawn in winter: old apartment blocks, bare trees, a few boxy 1970s sedan cars parked, dim street lamps, cold blue light, a long line of tiny figures along the sidewalk.'
    overlay: '1979'
    overlay_pos: top-left
  - say: İstanbul'da bir kış sabahı.
    reuse: s01_01
    move: in
  - say: Saat daha altı.
    image: Close-up of a 1970s wristwatch on a sleeve showing six o'clock, breath vapor in the cold air, dark blue dawn light.
    overlay: 06:00
  - say: Sen kaldırımda bekliyorsun.
    image: '{SEN} standing on a cold sidewalk at dawn wrapped in a long coat and scarf, hands in pockets, shivering, an empty steel gas cylinder at his feet.'
  - say: Elinde bir boş tüp.
    image: Close-up of a dented blue-grey steel kitchen gas cylinder standing on a sidewalk, a gloved hand resting on its handle.
    overlay: BOŞ TÜP
  - say: Önünde kırk kişi var.
    image: View from behind {SEN} of a long queue of people in winter coats ahead of him, each with a steel gas cylinder beside them, stretching toward a closed shop with shutters down.
  - say: Arkanda ise sokağın sonu görünmüyor.
    image: A queue of people with gas cylinders stretching back along the street and disappearing around a corner into morning fog, seen from the front.
  - say: Tüpçünün kamyonu gelecek mi? Belli değil.
    image: An empty road at dawn seen from the sidewalk, people in the queue leaning out and craning their necks to look down the road.
  - say: Kaç tüp getirecek? O da belli değil.
    reuse: s01_06
    move: left
  - say: Ve sonra uzaktan bir motor sesi.
    image: Two round headlights of an old 1970s flatbed truck appearing through the morning fog at the end of a street.
  - say: Kamyon duruyor. Tüpler iniyor.
    image: An old flatbed truck loaded with steel gas cylinders parked by the sidewalk, two workers handing cylinders down to the first people in the queue.
  - say: Bir, iki, üç… Sıra yaklaşıyor.
    image: '{SEN} near the front of the queue now, clutching his empty gas cylinder, eyes fixed on the truck, only three people ahead of him.'
  - say: Tam sana gelecekken kasa boşalıyor.
    image: The empty bed of the flatbed truck, a worker spreading both hands in a helpless gesture toward the waiting queue.
  - say: Tebrikler. Bin dokuz yüz yetmiş dokuzda yaşıyorsun.
    image: '{SEN} standing alone with his empty gas cylinder, stunned, while colorful confetti falls ironically around him on the grey street.'
    overlay: TEBRİKLER
    overlay_pos: center
  - say: Bu yıl benzini karneyle alacaksın.
    reuse: s04_11
    move: in
  - say: Akşamları mum ışığında oturacaksın.
    image: A family living room in total darkness lit by a single candle on the table, silhouettes of three people sitting around it.
  - say: Kışın kızının okulu haftalarca kapalı kalacak.
    image: A closed school gate with a chain and padlock in the snow, an empty schoolyard behind it, a bored schoolgirl looking through the bars.
  - say: Ve en sık duyacağın kelime şu olacak.
    image: A neighborhood grocery store with completely empty wooden shelves, a grocer behind the counter spreading his hands.
  - say: Yok. Yok. Yok.
    reuse: s01_18
    move: in
    overlay: YOK
    overlay_pos: center
  - say: Bu kelimeyi aklında tut.
    image: A speech bubble shape drawn in chalk on a dark wall, empty inside, with a red circle around it.
  - say: Hadi. Boş tüpü sırtla, eve dönüyoruz.
    image: '{SEN} walking away down the street at sunrise carrying the empty gas cylinder on his shoulder, long shadow on the pavement.'
- title: Önce Biraz Arka Plan
  scenes:
  - say: Önce biraz arka plan.
    image: An old school wall map of Turkey and its neighbors hanging in a classroom, a wooden pointer leaning on it, warm light, no text on the map.
  - say: Türkiye'de kırk dört milyona yakın insan yaşıyor.
    image: A huge crowd of simple white-round-headed people in 1970s clothes filling a city square, flared trousers, headscarves, flat caps.
    overlay: 44 MİLYON
  - say: Ülke, petrolünün çoğunu dışarıdan alıyor.
    image: A big oil tanker ship approaching a refinery port with storage tanks and chimneys, seagulls, calm sea.
  - say: Petrol dolarla satılıyor.
    image: A barrel of oil on one side of an old balance scale and a stack of green banknotes on the other side.
  - say: Dolar ise kasada yok.
    image: A huge bank vault door wide open, the vault completely empty inside except for a spider web and a single coin on the floor.
    overlay: KASA BOŞ
  - say: Bin dokuz yüz yetmiş yedinin sonunda döviz rezervi tükenmiş.
    reuse: s02_05
    move: in
  - say: Üstelik komşuda, İran'da devrim oldu.
    image: A map-like scene of two neighboring countries, the one on the right with crowds waving plain flags in a city square, seen from afar, calm and non-violent.
  - say: Şah ocak ayında ülkesini terk etti.
    image: A 1970s passenger airplane taking off from an airport at dusk, a few figures watching from the runway.
  - say: Petrolün varili bir yıl içinde on altı dolardan kırk dolara yaklaşıyor.
    image: Two oil barrels side by side, a small one and one more than twice as tall, with a rising red arrow between them.
    overlay: 16'DAN 40 DOLARA
  - say: Türkiye'nin bütün ihracat geliri, tek başına petrol faturasına bile yetmiyor.
    image: A small wallet lying next to a very long paper bill that unrolls across a table and onto the floor.
  - say: O günlerde siyasetçilerin dilinde bir söz dolaşıyor.
    image: A podium with several microphones in front of a plain curtain, no person visible, spotlights on it.
  - say: Türkiye yetmiş sente muhtaç.
    image: Close-up of a few small foreign coins lying on a big empty wooden desk, a magnifying glass over them.
    overlay: 70 SENT
    overlay_pos: center
  - say: Bir dolar bile değil.
    reuse: s02_12
    move: in
  - say: Dolar olmayınca tanker gelmiyor.
    image: An empty harbor dock with idle cranes, an empty sea horizon, a dock worker looking through binoculars.
  - say: Tanker gelmeyince benzin, mazot ve tüpgaz da gelmiyor.
    image: 'A row of three items with a red cross over each: a petrol pump, a jerry can and a steel gas cylinder.'
  - say: Fabrikalar ithal parça bulamıyor, yarı kapasiteyle çalışıyor.
    image: A factory hall where half of the machines are covered with dust sheets, a few workers standing idle by a stopped conveyor belt.
    overlay: YARI KAPASİTE
  - say: Ve raflar yavaş yavaş boşalıyor.
    image: A grocery shelf where the goods fade away from left to right until the shelf is empty.
- title: Sen Kimsin?
  scenes:
  - say: Sen otuz beş yaşındasın.
    image: Portrait of {SEN} standing proudly in front of a 1970s apartment building entrance, hands on hips.
    overlay: 35 YAŞ
  - say: Bir devlet dairesinde memursun.
    image: '{SEN} sitting at a wooden desk in a 1970s government office with a typewriter, stacks of folders, a rotary phone and a wall calendar.'
  - say: Eşin ve sekiz yaşındaki kızınla kirada oturuyorsun.
    image: '{SEN}, {ES} and {KIZ} in a small 1970s living room with patterned wallpaper, a black-and-white television on a stand, a coal stove and crocheted doilies.'
  - say: O yıl asgari ücret ayda beş bin dört yüz lira.
    image: A brown pay envelope on a table with a few old banknotes and coins spilling out of it.
    overlay: 5.400 TL
  - say: Kulağa fena gelmiyor.
    reuse: s03_03
    move: in
  - say: Ama fiyatlar yılda yüzde altmıştan fazla artıyor.
    image: A shop window where every price tag is being replaced by a bigger price tag by a hand on a ladder, no readable numbers.
    overlay: '%60+ ENFLASYON'
  - say: Yani maaşın her ay biraz daha küçülüyor.
    image: A stack of banknotes melting like an ice cube on a plate, a small puddle around it.
  - say: Bir de araban var. Yerli malı, sarı bir otomobil.
    image: A small boxy yellow 1970s sedan car parked in front of an apartment building, shining, {SEN} polishing its hood with a cloth.
  - say: Koca ülkede yedi yüz bin kadar otomobil var.
    image: Aerial view of a wide 1970s boulevard with only a handful of boxy cars, many pedestrians and a horse cart.
    overlay: ~700.000 OTOMOBİL
  - say: Onlardan biri seninki.
    reuse: s03_08
    move: in
  - say: Sen ise her sabah yakıt göstergesine bakıyorsun.
    image: Close-up of a 1970s car dashboard fuel gauge with the needle resting on empty, a worried reflection in the glass.
  - say: Çünkü depo boş.
    image: '{SEN} looking into the open fuel filler of his yellow car with one eye, puzzled.'
    overlay: DEPO BOŞ
- title: 'Benzin: Karne Dönemi'
  scenes:
  - say: Haziran ayı. Benzine yine zam geliyor.
    image: A 1970s petrol station on a sunny June day, an attendant on a ladder changing the price board, cars waiting.
    overlay: HAZİRAN 1979
  - say: Normal benzin yirmi iki, süper yirmi beş lira.
    image: Close-up of two old mechanical petrol pumps side by side with spinning number wheels, no readable text.
    overlay: SÜPER 25 TL
  - say: Zam haberi duyulunca istasyonlar satışı durduruyor.
    image: A petrol station with a chain stretched across its entrance, the attendant sitting on a chair with arms crossed, pumps covered.
  - say: Sonra kuyruk başlıyor.
    image: A very long line of boxy 1970s cars bumper to bumper along the Istanbul seaside road, the sea and ferries on one side, seen from above.
  - say: Arabalar sahil yolunda tampon tampona.
    reuse: s04_04
    move: right
  - say: Kimse motoru çalıştırmıyor. Herkes itiyor.
    image: '{SEN} pushing his small yellow car from behind in a long line of cars, sweating, other drivers pushing their cars too.'
  - say: Termosta çay, torbada simit.
    image: Close-up of a thermos, two tea glasses and sesame bread rings laid out on the hood of a yellow car.
  - say: Kuyrukta tavla açanlar bile var.
    image: Two drivers playing backgammon on a folding stool between two cars in a queue, others watching.
  - say: Bazen sıra neredeyse bütün gün sürüyor.
    reuse: s04_04
    move: out
  - say: On dokuz Haziranda İstanbul'da yeni bir dönem başlıyor.
    image: A wall calendar page being torn off by a hand, a sunny window behind it.
    overlay: 19 HAZİRAN
  - say: Benzin karnesi.
    image: Close-up of a small paper fuel ration card with perforated coupons held between two fingers.
    overlay: BENZİN KARNESİ
    overlay_pos: bottom
  - say: Karneyi kaymakamlıktan alıyorsun.
    image: An old government building with wide stone steps, a crowd of men with car keys in their hands queuing up the stairs to the door.
  - say: Tabii önce karne kuyruğuna giriyorsun.
    image: '{SEN} standing in a long queue inside a government corridor, holding his car papers, a clerk behind a small window far ahead.'
  - say: Yani kuyruğa girebilmek için bir kuyruk.
    image: A comic spiral of people queuing in a circle that leads into another queue, seen from above.
  - say: Gazetedeki karikatür durumu özetliyor.
    image: '{SEN} reading a folded newspaper on a bench and chuckling, the newspaper shows a small cartoon drawing with no readable text.'
  - say: Adam benzin yok diye eşek almış.
    image: A man in a suit sitting proudly on a donkey in the middle of a city street, a useless car parked behind him.
  - say: Bu sefer de saman darlığı çıkmış.
    reuse: s04_16
    move: in
  - say: Sen de arabayı kapının önüne çekip üstüne bir örtü seriyorsun.
    image: '{SEN} and {ES} spreading a big grey cloth cover over the small yellow car in front of the building.'
  - say: Artık o bir araba değil. Bir süs eşyası.
    image: The covered car with a flower pot placed on its roof and a cat sleeping on its hood.
- title: İşe Nasıl Gideceksin?
  scenes:
  - say: Peki işe nasıl gideceksin?
    image: '{SEN} standing at a bus stop in the morning with a briefcase, looking at his watch, a big crowd around him.'
  - say: Dolmuşlar az. Otobüsler tıklım tıklım.
    image: A 1970s city bus so crowded that people are pressed against the windows and hanging at the doors.
  - say: İstanbullular banliyö trenine akın ediyor.
    image: A crowded 1970s suburban train station platform, a commuter train arriving, a sea of people waiting.
    overlay: BANLİYÖ TRENİ
  - say: Sen de kapıda asılı gidiyorsun.
    image: '{SEN} hanging on to the door handle of a packed commuter train car, briefcase between his knees, tie flying in the wind.'
  - say: Arabalı vapur saatte bir sefere iniyor.
    image: A car ferry on the Bosphorus leaving the pier, a long line of people watching it go, a clock tower nearby.
  - say: Gazetede bir haber var. Mazotsuz kalan köylüler dört tankere el koymuş.
    image: A group of villagers with flat caps standing in the middle of a country road with arms raised, stopping four fuel tanker trucks, tractors parked beside the fields, calm scene.
    overlay: 4 TANKER
  - say: On beş gündür yakıt bulamamışlar.
    reuse: s05_06
    move: in
  - say: Traktör çalışmazsa tarla sürülmez.
    image: A red tractor standing silent in the middle of an unplowed field, a farmer sitting on its wheel with his chin in his hand.
  - say: Tarla sürülmezse ekmek olmaz.
    image: An empty wooden bakery shelf with a single small loaf of bread on it.
  - say: Hepsi, limana girecek bir tankere bağlı.
    image: A lone figure standing on a pier at sunset looking at the empty sea horizon, waiting.
- title: Bakkalda Tek Kelime
  scenes:
  - say: Akşam eve dönerken bakkala uğruyorsun.
    image: Exterior of a small 1970s Turkish neighborhood grocery at dusk, crates outside, a striped awning, {SEN} walking in with his briefcase.
  - say: Margarin var mı?
    image: '{SEN} at the counter of the grocery asking a question with one finger raised, {BAKKAL} behind the counter listening.'
  - say: Yok, diyor bakkal.
    image: '{BAKKAL} behind his counter shaking his head with both palms up, half-empty shelves behind him.'
    overlay: YOK
    overlay_pos: center
  - say: Peki şeker?
    reuse: s06_02
    move: in
  - say: O da yok.
    reuse: s06_03
    move: left
    overlay: YOK
    overlay_pos: center
  - say: Ampul var mı bari?
    reuse: s06_02
    move: left
  - say: Bakkal gülüyor. Ampul hiç yok.
    image: '{BAKKAL} laughing with his hand on his belly, pointing at an empty cardboard box.'
    overlay: HİÇ YOK
  - say: O günlerde kahve, çay, margarin, ampul, şeker, hatta ilaç bulmak zor.
    image: 'A row of six items each inside a dotted outline as if missing: a coffee cup, a tea glass, a margarine block, a light bulb, a sugar bowl and a medicine bottle.'
  - say: Kahve ithalatı yıllardır neredeyse durmuş.
    image: An empty copper Turkish coffee pot upside down on a shelf next to an empty coffee tin with a moth flying out.
  - say: Misafire artık kahve yerine çay ikram ediliyor.
    image: '{ES} serving tea in tulip glasses on a tray to two guests in the living room, an empty coffee cup set left in the cabinet.'
  - say: Margarin geldiği gün haber bütün mahalleye yayılıyor.
    image: Women leaning out of apartment windows calling to each other across a narrow street, children running with shopping nets.
  - say: Anlatılanlara göre kimi bakkal paketi ikiye bölüp satıyor.
    image: '{BAKKAL} carefully cutting a block of margarine in half with a big knife on the counter, customers watching closely.'
    overlay: YARIM PAKET
  - say: Herkese yarım paket.
    reuse: s06_12
    move: in
  - say: Sigara mı? Kimi yerde kişi başı en fazla beş paket.
    image: A tobacco kiosk with a long queue of men, the seller handing out a small stack of five plain cigarette packs.
    overlay: EN FAZLA 5
  - say: O yıllarda İstanbul'da yağ almak isteyenler bir gün Haydarpaşa Garı'nı dolduruyor.
    image: The grand Haydarpasa train station hall filled with a huge crowd of people holding empty bottles and tin cans, a few policemen organizing the queue.
  - say: Gar o gün yolcuyla değil, kuyrukla doluyor.
    reuse: s06_15
    move: out
  - say: Bakkalın tezgâhının altında ise bambaşka bir dünya var.
    image: 'View under a grocery counter: hidden boxes and tins stacked in the shadows, the grocer''s feet beside them.'
- title: Karaborsa
  scenes:
  - say: Buna karaborsa deniyor.
    image: A shady man in a long coat opening it slightly to show goods hidden inside, in a back alley at night, comedic not scary.
    overlay: KARABORSA
  - say: Her malın bir resmi fiyatı var.
    image: An official price list board hanging on a shop wall with a stamp and seal, no readable text, a clerk pointing at it.
  - say: Ama o fiyattan satılan mal yok.
    reuse: s01_18
    move: out
  - say: Tezgâhın üstünde yok. Tezgâhın altında var.
    image: 'Split view of a grocery counter: the top is empty and clean, underneath it is crammed with boxes, tins and bottles.'
  - say: Fiyatı ise kat kat fazla.
    reuse: s07_04
    move: in
    overlay: KAT KAT PAHALI
  - say: Kimi tüccar malı depoya kapatıp zammı bekliyor.
    reuse: s07_04
    move: left
  - say: Zabıta baskın yapıyor.
    image: Municipal inspectors in 1970s uniforms and caps opening a big warehouse door with flashlights, daylight flooding in.
  - say: Haziranda bir depodan bir ton yağ çıkıyor.
    image: Inspectors standing in front of a mountain of stacked oil tins inside a warehouse, one of them counting on a clipboard.
    overlay: 1 TON YAĞ
  - say: Belediyeler tanzim satış mağazaları açıyor. Mal ucuz, ama orada da kuyruk var.
    image: A simple municipal shop with a plain awning, crates of vegetables and sacks outside, a very long orderly queue of people with shopping nets.
    overlay: TANZİM SATIŞ
  - say: Bu ülkede o yıl üç şey hiç bitmiyor.
    image: Three fingers held up by a hand in front of a grey city background.
    overlay: 3 ŞEY
  - say: Zam. Kuyruk. Ve söylenti.
    image: A chain of neighbors whispering into each other's ears along a street, the last one looking shocked.
  - say: Yarın şeker gelecekmiş.
    reuse: s07_11
    move: in
  - say: Kim demiş? Karşı komşunun berberi.
    image: A barber in a white coat whispering to a customer covered in shaving foam in a 1970s barber shop, mirror and scissors.
- title: Tüp Meselesi
  scenes:
  - say: Gelelim senin boş tüpe.
    reuse: s01_05
    move: in
  - say: Evde ocak tüple yanıyor.
    image: A 1970s kitchen with a small two-burner stove connected by a hose to a steel gas cylinder under the counter, a kettle on the stove.
  - say: Tüp biterse yemek yok. Çay yok.
    image: A cold empty pot on an unlit stove, {ES} standing beside it holding an empty tea glass upside down.
  - say: O yüzden tüp kuyruğu bir aile görevi.
    image: A hand-drawn family duty chart on the wall with three small portraits and time slots marked by clocks, no readable text.
  - say: Sabah sen bekliyorsun.
    reuse: s01_04
    move: in
  - say: Öğlen eşin devralıyor.
    image: '{ES} taking over the place in the queue from {SEN} on the sidewalk, he hands her the empty gas cylinder like a relay baton.'
  - say: Mahallede herkes birbirinin sırasını tutuyor.
    image: A row of empty gas cylinders, shopping bags and stools left on the sidewalk holding places in a queue, a few neighbors chatting beside them.
  - say: Ocak bin dokuz yüz seksende tüp, bir gecede yüz yirmi beş liradan yüz seksen iki liraya çıkacak.
    image: Two gas cylinders side by side with a rising arrow between them, coins stacked next to each, the second stack much taller.
    overlay: 125'TEN 182 TL
  - say: Bir akşam tam yemek pişerken ocak sönüyor.
    image: A stove flame going out under a pot in a 1970s kitchen, {ES} staring at it with a wooden spoon in her hand.
  - say: Kuru fasulye artık sobanın üstünde pişiyor.
    image: A pot of beans bubbling on top of a small coal stove in the living room, the family gathered around it with spoons ready.
  - say: Soba yanıyorsa tabii.
    reuse: s08_10
    move: in
- title: Işıklar Sönüyor
  scenes:
  - say: Kasım ayı. Ankara'da hükümet değişiyor.
    image: A grand government building in Ankara in autumn rain, black official cars arriving and leaving, seen from afar.
    overlay: KASIM 1979
  - say: Ecevit gidiyor, Demirel geliyor.
    image: Two plain office chairs at a big desk, one being carried out of the room and another being carried in by workers, no people's faces shown.
  - say: Kuyruk ise yerinde duruyor.
    reuse: s01_06
    move: right
  - say: 'Yeni hükümetin ilk toplantısının gündemi tanıdık: yağ, kömür ve elektrik kısıntısı.'
    image: A long cabinet meeting table seen from above with papers, water glasses and empty chairs, a single desk lamp on.
  - say: Çünkü artık elektrik de yok.
    image: A whole 1970s city neighborhood at night with every window dark, only the moon and a few candle glows visible.
  - say: Büyük şehirlerde her gün dört beş saat kesinti var.
    reuse: s09_05
    move: out
    overlay: GÜNDE 4-5 SAAT
  - say: Kesintinin programı gazetede yazıyor.
    image: A newspaper page pinned on a kitchen wall with a table of neighborhoods and clock icons, a pencil circling one row, no readable text.
  - say: Bir de programsız olanı var. O sürpriz.
    image: '{SEN} frozen halfway through shaving in front of a bathroom mirror as the light goes out, foam on half his face.'
  - say: Türkiye, komşusu Bulgaristan'dan elektrik satın alıyor.
    image: High voltage power line pylons crossing a border with a small border post and barrier, electricity sparks traveling along the wires.
  - say: Evde mum stokluyorsun.
    image: A kitchen drawer full of white candles and matchboxes, a hand adding one more candle.
  - say: Mum da bulursan.
    reuse: s06_03
    move: in
  - say: Televizyon tek kanal ve siyah beyaz.
    image: A 1970s black-and-white television set with a rabbit-ear antenna and a lace doily on top, showing a grey screen, in a living room.
    overlay: TEK KANAL
  - say: Yayın akşama doğru başlıyor.
    image: The family sitting in a row on the sofa staring at the television that shows only a test pattern of grey stripes, a wall clock above.
  - say: Tam başlayacakken elektrik gidiyor.
    image: A completely dark living room, only pairs of small white dot eyes visible in the blackness, the television screen dead.
  - say: Yüz evden aynı anda aynı ses yükseliyor.
    image: A dark apartment block at night with exclamation marks rising from every window.
    overlay: OFFF!
    overlay_pos: center
  - say: Kızın ödevini gaz lambasıyla yapıyor.
    image: '{KIZ} doing homework at the table by the light of a kerosene lamp, notebook and pencil, warm glow.'
  - say: Sen de aynı ışıkta incelmiş gazeteni okuyorsun.
    image: '{SEN} reading a very thin newspaper by kerosene lamp light, holding it up so that it looks like just a few sheets.'
  - say: Kâğıt yokluğundan bazı gazeteler on iki sayfaya indi.
    image: A newsstand with small thin stacks of newspapers, the seller shrugging, no readable text.
    overlay: 12 SAYFA
- title: 'Kış: Paltoyla Mesai'
  scenes:
  - say: Sonra kış bastırıyor. Bin dokuz yüz seksenin ocak ayı.
    image: Istanbul rooftops and a mosque silhouette under heavy snow, grey sky, seagulls, smoke rising from only a few chimneys.
    overlay: OCAK 1980
  - say: Kalorifer yakıtı yok.
    image: A cold cast iron radiator under a window with icicles hanging from it, frost flowers on the window glass.
  - say: Karaborsada fiyatı normalin beş katı.
    image: A fuel barrel with five stacks of coins lined up next to it, each stack taller than the last.
    overlay: 5 KATI
  - say: Pencerelerden birer birer soba borusu çıkıyor.
    image: The facade of a 1970s apartment block in the snow with stove pipes sticking out of many windows, each puffing a little smoke.
    overlay: SOBA BORUSU
  - say: Koca apartman bir köy evine dönüyor.
    reuse: s10_04
    move: up
  - say: Dairede memurlar paltoyla oturuyor.
    image: A government office where all the clerks sit at their desks wearing heavy coats, scarves and hats, breath vapor visible.
  - say: Sen evrakı eldivenle imzalıyorsun.
    image: Close-up of {SEN} signing a document with a fountain pen while wearing thick woolen gloves, a glass of tea steaming beside him.
  - say: İstanbul'da bir belediye meclisi ısıtılmayan salonda toplanıyor.
    image: A formal council chamber where the members sit in coats and scarves around a horseshoe table, cold blue light.
  - say: Okullar ise tatil. Çünkü sınıfları ısıtacak yakıt bulunamıyor.
    image: An empty classroom with wooden desks, a cold stove in the corner and snow visible through the windows.
  - say: Tatil uzadıkça uzuyor. Kimi hesaba göre elli günü buluyor.
    image: '{KIZ} building a big snowman in the street with other children, schoolbag forgotten in the snow.'
    overlay: ~50 GÜN TATİL
  - say: Okullar ancak mart başında açılıyor.
    image: Children in black smocks walking back through the school gate as the snow melts, a teacher ringing a hand bell.
  - say: Kızın çok mutlu.
    image: '{KIZ} jumping with joy on the sofa, arms in the air.'
  - say: Sen o kadar değilsin.
    reuse: s10_14
    move: left
  - say: Bütün aile tek odaya, sobanın başına toplanıyor.
    image: '{SEN}, {ES}, {KIZ} and an old grandmother with a white round head and headscarf all sitting close together around a glowing coal stove under blankets.'
  - say: Yaşlı bir kadın yabancı bir gazeteciye şöyle diyor.
    image: An old woman with a white round head, headscarf and shawl talking to a reporter who holds a notepad, in a small warm room.
  - say: Yakıtsızlık bizi yeniden bir araya getirdi.
    reuse: s10_14
    move: in
  - say: Haklı. Yıllardır bu kadar çok konuşmamıştınız.
    image: The family laughing together around the stove, roasting chestnuts on its top, the dead television ignored in the corner.
- title: 24 Ocak 1980
  scenes:
  - say: Yirmi dört Ocak akşamı.
    image: A snowy Istanbul street at dusk with lit apartment windows, people hurrying home.
    overlay: 24 OCAK 1980
  - say: Saat yedi haberleri başlıyor.
    image: A wall clock showing seven o'clock above a black-and-white television set that is just coming on.
    overlay: '19:00'
  - say: Elektrik var. Bu bile haber.
    image: The family looking up in surprise at the glowing ceiling lamp in their living room.
  - say: Spiker kâğıttan okuyor.
    image: A black-and-white television screen showing a news presenter with a white round head in a suit and tie reading from a sheet of paper at a desk.
  - say: Dolar kırk yedi liradan yetmiş liraya çıktı.
    image: A green banknote on a seesaw shooting up into the air while a small pile of old coins drops down on the other side.
    overlay: 47'DEN 70 TL
    overlay_pos: center
  - say: Hem de bir gecede.
    reuse: s11_04
    move: in
  - say: İki yıl önce yirmi beş liraydı.
    image: Three steps of a staircase, each higher than the last, with a green banknote climbing them.
    overlay: 25 - 47 - 70
  - say: Arkasından zamlar sıralanıyor.
    reuse: s11_04
    move: out
  - say: Sigara yüzde otuz yedi.
    image: A plain cigarette pack with a rising arrow beside it on a kiosk counter.
    overlay: SİGARA %37
  - say: Şeker yüzde otuz beş.
    image: A bowl of sugar cubes with a rising arrow beside it on a kitchen table.
    overlay: ŞEKER %35
  - say: Tüpgaz yüzde kırk beş.
    image: A steel gas cylinder with a rising arrow beside it.
    overlay: TÜPGAZ %45
  - say: Kömür yüzde yüz.
    image: A heap of coal with a tall rising arrow beside it.
    overlay: KÖMÜR %100
  - say: İki gün sonraki manşet kısa. Fiyatlar serbest, zamlar geldi.
    image: A newspaper front page with a huge bold headline shape and no readable text, lying on a doormat in the snow.
    overlay: FİYATLAR SERBEST
    overlay_pos: bottom
  - say: Kararları hazırlayan ekibin başında bir isim var. Turgut Özal.
    image: 'A bureaucrat''s desk seen from behind: a stout man in a suit and glasses bent over thick folders under a desk lamp, face not shown.'
  - say: Onun hikâyesi ayrı bir video konusu.
    image: A thick closed folder tied with a ribbon on a desk, a small bookmark sticking out.
  - say: Sen hesap makinesini çıkarıyorsun.
    image: '{SEN} at the kitchen table at night with a big 1970s calculator, bills and a pencil, {ES} looking over his shoulder.'
  - say: Sonra geri koyuyorsun. Bakmak istemiyorsun.
    reuse: s11_16
    move: out
- title: Planı Hatırlıyor musun?
  scenes:
  - say: Planı hatırlıyor musun?
    image: A thought bubble above {SEN} showing full shelves and a smiling sun.
    overlay: PLAN?
  - say: Mal gelecek, kuyruk bitecek, sen de rahatlayacaktın.
    image: A dreamy scene of {SEN} strolling out of a grocery with full shopping bags and no queue, birds singing.
  - say: Fiyatlar serbest kalınca depolardaki stoklar piyasaya çıkıyor.
    image: A big warehouse door swinging open and crates rolling out on trolleys toward waiting trucks.
  - say: Bakkalın rafları doluyor.
    image: The neighborhood grocery with every shelf packed full of tins, boxes, bottles and packets, {BAKKAL} proudly spreading his arms.
  - say: Margarin var. Şeker var. Ampul bile var.
    reuse: s12_04
    move: in
    overlay: VAR!
    overlay_pos: center
  - say: Kuyruk da yok artık.
    image: An empty sidewalk in front of a full shop window, a single pigeon walking by.
  - say: Çünkü bu sefer para yok.
    image: '{SEN} standing in front of the full shop turning his trouser pockets inside out, a moth flying out.'
    overlay: PARA YOK
  - say: O yıl enflasyon yüzde yüz dolayında.
    image: A thermometer shaped like a price tag with the red line bursting out of the top.
    overlay: ~%100
  - say: Bir araştırmacı o günleri şöyle özetliyor.
    image: An open book on a desk with reading glasses on it and a desk lamp.
  - say: Mal kıtlığı bitti, alıcı kıtlığı başladı.
    image: A shopkeeper standing alone in the doorway of a fully stocked shop looking up and down an empty street.
  - say: Dün raf boştu, cebin doluydu.
    reuse: s01_18
    move: left
  - say: Bugün raf dolu, cebin boş.
    reuse: s12_04
    move: out
  - say: Sen vitrine bakıyorsun. Vitrin de sana.
    image: '{SEN} with his nose pressed against a shop window full of goods, his reflection looking back at him.'
  - say: Kahve mi? O hâlâ yok.
    reuse: s06_03
    move: in
    overlay: YOK
    overlay_pos: center
  - say: Onun serbest kalması için bin dokuz yüz seksen ikiyi bekleyeceksin.
    image: An empty Turkish coffee cup on a saucer next to a wall calendar with many pages still to turn.
    overlay: '1982'
- title: Bugün
  scenes:
  - say: Şimdi bugüne gelelim.
    image: A modern Turkish city skyline with skyscrapers, bridges and highways at sunrise.
  - say: O gün kırk dört milyondunuz.
    reuse: s02_02
    move: in
  - say: Bugün seksen altı milyonsunuz.
    image: A much bigger modern crowd of white-round-headed people with smartphones filling a huge city square.
    overlay: 86 MİLYON
  - say: O gün yedi yüz bin otomobil vardı.
    reuse: s03_08
    move: out
  - say: Bugün milyonlarcası var.
    image: A wide modern highway packed with modern cars in a traffic jam at rush hour, seen from above.
  - say: Kuyruk yine var. Ama adı artık trafik.
    reuse: s13_05
    move: in
    overlay: TRAFİK
  - say: Evine gaz borudan geliyor.
    image: A modern kitchen with a sleek stove and a yellow natural gas pipe along the wall, a blue flame burning.
  - say: Market siparişini telefondan veriyorsun.
    image: A courier on a scooter with a delivery box handing a full grocery bag to someone at an apartment door.
  - say: Sen ise seksen iki yaşındasın.
    image: '{SEN_YASLI} sitting in an armchair on a sunny balcony with a glass of tea, potted plants around him.'
    overlay: 82 YAŞ
  - say: Torunun marketten dönüyor. Dede, istediğin peynir yokmuş.
    image: The grandson shrugging with an empty hand in front of {SEN_YASLI}.
  - say: Sen gülümsüyorsun. Yok mu?
    image: Close-up of {SEN_YASLI} smiling with a twinkle behind his round glasses.
    overlay: YOK MU?
  - say: Ben o kelimeyi iyi bilirim.
    reuse: s06_03
    move: out
  - say: Balkonun köşesinde hâlâ bir boş tüp duruyor.
    image: An old dented blue-grey steel gas cylinder standing in the corner of a modern balcony between flower pots, a cat sleeping on top of it.
    overlay: BOŞ TÜP
  - say: Eşin her yıl soruyor. Bunu artık atsak mı?
    image: An elderly woman with a white round head, grey bob hair and a cardigan pointing at the old gas cylinder on the balcony with a broom in her hand.
  - say: Sen her yıl aynı cevabı veriyorsun.
    reuse: s13_09
    move: in
  - say: Dursun. Belli olmaz.
    reuse: s13_13
    move: in
    overlay: BELLİ OLMAZ
- title: Senin Ailenin Hikâyesi
  scenes:
  - say: Senin ailende o kuyruklarda bekleyen biri var mı?
    image: An old family photo album open on a table with black-and-white photos from the 1970s, a glass of tea beside it.
  - say: Annen, baban, deden?
    reuse: s14_01
    move: in
  - say: En uzun hangi kuyrukta beklemişler?
    reuse: s01_06
    move: out
  - say: Hikâyesini yorumlara yaz.
    image: '{SEN_YASLI} telling a story with big hand gestures while his grandson types on a smartphone next to him on the sofa.'
  - say: Abone olmayı da unutma.
    image: '{SEN_YASLI} waving cheerfully from his balcony at sunset, the old gas cylinder beside him.'
  - say: Merak etme. Bu buton için kuyruk yok.
    reuse: s14_05
    move: in
    overlay: KUYRUK YOK
