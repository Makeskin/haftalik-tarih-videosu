# O Yıl Sen — Bölüm 5: Gecekondudan Apartmana
title: "Eğer 80'lerde Gecekondudan Apartmana Taşınsaydın?"
motif: "İncir — 1968'de avluya dikilen incir fidanı; yıkımda kaybolur, finalde balkondaki saksıda geri gelir. Tekrar eden şaka: 'Bu duvarı ben ördüm.'"
characters:
  SEN_GENC: "a 25-year-old Turkish man in 1968, white round head, dot eyes, thin mustache, flat cap, rolled-up white shirt sleeves, worn dark trousers"
  SEN: "a 41-year-old Turkish factory worker in the 1980s, white round head, dot eyes, thick black mustache, flat cap, grey wool vest over a checked shirt, dark trousers"
  SEN_YASLI: "a 78-year-old Turkish grandfather in 2026, white round head, dot eyes, white mustache, flat cap, brown cardigan, wooden walking cane"
  ESIN: "a Turkish housewife in the 1980s, white round head, dot eyes, floral headscarf tied under the chin, long patterned skirt, knitted cardigan"
  KIZIN: "a 13-year-old Turkish girl in the 1980s, white round head, dot eyes, two braids, black school pinafore with white collar"
  OGLUN: "a 9-year-old Turkish boy in the 1980s, white round head, dot eyes, short hair, red striped sweater, shorts"
  MUTEAHHIT: "a 1980s Turkish building contractor, white round head, dot eyes, thick mustache, brown suit with wide lapels, gold wristwatch, rolled blueprint under his arm"
  MUTEAHHIT_GENC: "a young Turkish real estate developer in 2026, white round head, dot eyes, slim navy suit, no tie, holding a tablet"
  MUHTAR: "a 1980s Turkish neighborhood headman, white round head, dot eyes, grey mustache, thick glasses, cardigan, holding a rubber stamp"
youtube:
  title: "Eğer 80'lerde Gecekondudan Apartmana Taşınsaydın?"
  description: |-
    1968'de bir gecede kurduğun ev, 1984'te çıkan imar affıyla bir kâğıda, 1986'da dört kat hakkına, 1989'da üçüncü kattaki bir daireye dönüşüyor. Arada kapına bir müteahhit geliyor, yirmi yıllık ev yirmi dakikada yıkılıyor, iki buçuk yıl kirada bekliyorsun.

    Bu videoda Türkiye'nin gecekondudan apartmana geçtiği yıllara dönüyoruz: 2981 sayılı imar affı, tapu tahsis belgesi, ıslah imar planı, kat karşılığı pazarlığı, yüzde altmışları aşan enflasyon, ilk kalorifer, ilk apartman toplantısı ve bugün kapıyı yeniden çalan kentsel dönüşüm.

    Senin ailende gecekondudan apartmana geçen var mı? Evi müteahhide verdiniz mi, yoksa direndiniz mi? Hikâyeni yorumlara yaz.

    Not: Hikâye kurgusal bir ailenin gözünden anlatılır; videodaki tarih ve rakamlar kaynaklara dayanır. Görseller ve seslendirme yapay zekâ ile üretilmiştir.
