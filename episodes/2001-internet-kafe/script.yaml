# O Yıl Sen — Bölüm 3: 2001 İnternet Kafe
title: "Eğer 2001'de Bir İnternet Kafe Müdavimi Olsaydın?"
motif: "Süre — ekrandaki geri sayım ve tükenen dakikalar; tekrar eden şaka: farenin içindeki lastik bilyeyi çıkarıp avuçta yuvarlamak"
characters:
  SEN: "a 16-year-old Turkish high school student in 2001, white round head, dot eyes, wearing an oversized navy blue hoodie, loose denim trousers, sneakers"
  KAFECI_ABI: "a 28-year-old internet cafe owner in 2001 Turkey, white round head, dot eyes, mustache, cigarette tucked behind ear, dark vest over a polo shirt"
  ARKADAS: "a 16-year-old male classmate in 2001 Turkey, white round head, dot eyes, wearing a grey athletic sweatshirt"
  POLIS: "a Turkish police officer in 2001 uniform, white round head, dot eyes, dark blue peaked cap and jacket, holding a clipboard"
  TOSTCU_CIRAK: "a 14-year-old cafe helper in 2001, white round head, dot eyes, simple white apron, carrying toasted bread on a small plate"
youtube:
  title: "Eğer 2001'de Bir İnternet Kafe Müdavimi Olsaydın?"
  description: |-
    2001. Okul zili çalıyor. Çantayı tek omzuna asıp bodrum katın merdivenlerine koşuyorsun. Ağır demir kapıyı ittiğin an o koku seni karşılıyor: yanık kaşarlı tost, bayat sigara dumanı ve onlarca kasanın fan uğultusu.

    Bu videoda evinde internetin ve bilgisayarın lüks olduğu iki bin bir yılına dönüyoruz: farenin içindeki lastik bilyeyi temizlemek, masaya bir saat süre açtırmak, de_dust2 haritasında kör eden flash bombaları, Half-Life'ta siren çalınca sığınağa koşan on kişi, mIRC pencerelerinde 'slm asl' yazışmaları, 1.44 megabaytlık diskete sığdırılan hayatlar ve ansızın içeri giren polis denetimleri.

    Sen iki binli yıllarda internet kafeye gider miydin? En çok hangi oyunu oynardın? Masanın süresi bittiğinde ne yapardın? Hikâyeni yorumlara yaz.

    Not: Hikâye kurgusal bir öğrencinin gözünden anlatılır; videodaki rakamlar doğrulanmış resmi kaynaklara dayanır. Görseller ve seslendirme yapay zekâ ile üretilmiştir.

    #2001 #InternetKafe #CounterStrike #Nostalji #Türkiye #YakınTarih
