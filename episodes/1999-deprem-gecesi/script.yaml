# O Yıl Sen — Bölüm 4: 17 Ağustos 1999 Gecesi
title: "Eğer 17 Ağustos 1999 Gecesi Gölcük'te Uyansaydın?"
motif: "Komşu — enkazdan çıkanların neredeyse hepsini komşular çıkardı; tekrar eden nesne: o gece kaybolan tek terlik"
characters:
  SEN: "a 17-year-old Turkish boy in summer 1999, white round head, dot eyes, wearing a faded white t-shirt and blue shorts"
  ANNE: "a 42-year-old Turkish mother in 1999, white round head, dot eyes, short brown hair, wearing a floral cotton nightgown and a light cardigan"
  BABA: "a 46-year-old Turkish father in 1999, white round head, dot eyes, thick mustache, wearing a white sleeveless undershirt and grey trousers"
  KARDES: "a 9-year-old Turkish girl in 1999, white round head, dot eyes, two pigtails, wearing pink pajamas, holding a small teddy bear"
  KEMAL_AMCA: "a 60-year-old Turkish retired neighbor in 1999, white round head, dot eyes, bald with grey side hair, wearing striped pajamas and a knitted vest"
youtube:
  title: "Eğer 17 Ağustos 1999 Gecesi Gölcük'te Uyansaydın?"
  description: |-
    16 Ağustos 1999. Sıcak bir yaz gecesi. Balkonda karpuz yediniz, yarın sabah denize gideceksiniz. Saat üçü iki geçe, ev seni yataktan fırlatıyor.

    Bu videoda Marmara Depremi'nin gecesine, kurgusal bir lise öğrencisinin gözünden dönüyoruz: karanlıkta inilen merdivenler, tek terlikle sokağa çıkmak, günlerce çalmayan telefonlar, beş gün yanan rafineri, sınırın öbür yanından gelen kurtarma ekipleri, çadırda girilen iki bin yılı ve bütün bu hikâyenin asıl kahramanı: komşular.

    Bu videoyu o gece hayatını kaybeden on binlerce insanın anısına saygıyla hazırladık.

    O geceyi sen ya da ailen nasıl yaşadı? Hikâyeni yorumlara yaz.

    Not: Hikâye kurgusal bir ailenin gözünden anlatılır; videodaki rakamlar açıklamadaki kaynaklara dayanır. Kaynaklar arasında farklı rakamlar olduğunda bunu videoda belirttik. Görseller ve seslendirme yapay zekâ ile üretilmiştir.

    #1999 #17Ağustos #MarmaraDepremi #Gölcük #YakınTarih #Türkiye
