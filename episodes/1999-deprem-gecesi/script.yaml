thumbnail:
  image: "a Turkish teenage boy in t-shirt and shorts standing barefoot on a dark street at night in 1999, one slipper in his hand, behind him apartment buildings in darkness under a starry sky, neighbors in pajamas holding flashlights, emotional, cinematic, no injuries"
  text: "17 AĞUSTOS\n1999"
sources:
  - "Saat, büyüklük, süre, can kaybı, evsiz ve yıkılan konut sayıları, kıyıların su altında kalması — Cumhuriyet, 17.08.2022: https://www.cumhuriyet.com.tr/turkiye/turkiyenin-en-uzun-gecesi-17-agustos-1999da-neler-yasandi-17-agustos-depreminde-kac-kisi-hayatini-kaybetti-1970765"
  - "Süre farkları, resmî rakam aralığı, Tüpraş yangını, 21 ülkeden ekip, prefabrik konutlar — Wikipedia, 1999 İzmit earthquake: https://en.wikipedia.org/wiki/1999_%C4%B0zmit_earthquake"
  - "Elektrik ve telefon kesintisi, 50 bin kurtarılan ve %98'ini yöre halkının çıkarması, yabancı ekipler — ADRC raporu: https://www.adrc.asia/publications/recovery_reports/Marmara.pdf"
  - "AKUT'un 1999'daki büyüklüğü — Wikipedia: https://en.wikipedia.org/wiki/AKUT_Search_and_Rescue_Association"
  - "Yunan yardımı ve 7 Eylül 1999 Atina depremi — Wikipedia: https://en.wikipedia.org/wiki/Greek%E2%80%93Turkish_earthquake_diplomacy"
  - "Tek çadırda 15 kişi — Hürriyet, 27.10.1999: https://www.hurriyet.com.tr/gundem/tek-cadirda-15-kisi-39109987"
  - "Çadır ve prefabrikte yılbaşı, 138 gün, 'Kapıdışarı 99' — Hürriyet, 01.01.2000: https://www.hurriyet.com.tr/gundem/depremzedenin-milenyumu-39122869"
  - "12 Kasım 1999 Düzce depremi — Wikipedia: https://en.wikipedia.org/wiki/1999_D%C3%BCzce_earthquake"
  - "11 Ağustos 1999 güneş tutulması — CNN Türk: https://www.cnnturk.com/turkiye/iste-o-detay-99-depremi-gunes-tutulmasindan-kac-gun-sonra-oldu-1848669 ; NASA: https://eclipse.gsfc.nasa.gov/SEmono/TSE1999/T99PathDesc.html"
  - "Yapı Denetimi Kanunu (2001, 2011) — TRT Haber, 17.08.2023: https://www.trthaber.com/haber/turkiye/yapi-denetimiyle-1-milyona-yakin-bina-depreme-karsi-guvence-altina-alindi-789059.html"
  - "DASK'ın kuruluşu ve %57 sigortalılık (2024) — Şantiye: https://santiye.com.tr/dask-17-agustos-marmara-depremi-nin-25-yil-donumu-dolayisiyla-bir-aciklama-yapti-6402.html"
  - "AFAD deprem çantası listesi — NTV: https://www.ntv.com.tr/turkiye/deprem-cantasinda-bulunmasi-gerekenler,5q-QYo3qLk2MbPP5eU2Cnw"
sections:
  - title: "16 Ağustos 1999, Gece"
    scenes:
      - say: "On altı Ağustos, bin dokuz yüz doksan dokuz."
        image: "wide shot of a small Turkish coastal town at night in summer 1999, five-storey concrete apartment blocks along the Gulf of Izmit, warm yellow window lights, calm dark sea, starry sky"
        overlay: "16 AĞUSTOS 1999"
        overlay_pos: top-left
      - say: "Gölcük, körfezin kıyısında bir apartman."
        image: "medium shot of a modest five-storey apartment building in Golcuk 1999, laundry lines on balconies, a street lamp, quiet street"
      - say: "Dördüncü kat, balkon."
        image: "medium shot of a family sitting on a narrow apartment balcony at night in 1999, a small folding table, warm light from the living room behind"
      - say: "Ortada koca bir karpuz."
        image: "close-up of a sliced red watermelon on a metal tray on a balcony table at night, a knife and white cheese beside it"
      - say: "Annen dilimleri dağıtıyor."
        image: "medium shot of {ANNE} handing watermelon slices to {KARDES} on the balcony, smiling"
      - say: "Baban küçük radyonun düğmesini çevirip maç sonuçlarını arıyor, bulamayınca söyleniyor."
        image: "close-up of {BABA} turning the dial of an old portable radio on the balcony railing"
      - say: "Sen on yedi yaşındasın."
        image: "medium shot of {SEN} leaning on the balcony railing, looking at the sea, relaxed summer night"
      - say: "Yaz tatilinin tam ortası, lise son sınıf ve dershane şimdilik çok uzak."
        reuse: s01_07
        move: in
      - say: "Yarın için plan belli."
        image: "close-up of a beach bag by the apartment door with a rolled towel, a beach ball and swimming goggles"
      - say: "Sabah erkenden denize gideceksiniz."
        overlay: "PLAN: DENİZ"
        overlay_pos: top-right
        reuse: s01_09
        move: out
      - say: "Bu kelimeyi aklında tut: deniz."
        image: "wide shot of the dark calm Gulf of Izmit at night, moonlight reflecting on still water, distant lights of the opposite shore"
      - say: "Saat gece yarısını geçiyor."
        image: "close-up of a round wall clock in a 1999 Turkish living room showing past midnight"
      - say: "Karpuz kabukları toplanıyor, herkes kendi yatağına dağılıyor."
        image: "medium shot of a dim apartment hallway, doors to bedrooms half open, a ceiling fan turning slowly"
      - say: "Terliklerini her zamanki gibi yatağın altına itiyorsun."
        image: "close-up of a pair of blue plastic slippers being pushed under a bed by a foot, dim bedroom light"
      - say: "Birkaç saat sonra o terliklerden biri kaybolacak."
        reuse: s01_14
        move: in
      - say: "Telefonlar susacak."
        image: "close-up of a beige 1999 rotary push-button home telephone on a lace doily, in darkness"
      - say: "Ve sana en çok lazım olan şey, bir komşu olacak."
        image: "medium shot of a closed apartment door with a brass number plate and a small doormat, soft hallway light, quiet and still"
      - say: "Şimdilik uyu."
        image: "medium shot of {SEN} asleep in a narrow bed, window open, curtain moving in a warm breeze"

  - title: "Önce Biraz Arka Plan"
    scenes:
      - say: "Biraz geri çekilip büyük resme bakalım."
        image: "wide aerial shot of the Marmara region coastline at dusk in 1999, towns and factories along the gulf, cinematic"
        overlay: "MARMARA 1999"
        overlay_pos: top-left
      - say: "İzmit Körfezi, Türkiye'nin sanayi kalbi. Gece gündüz çalışan bir kıyı."
        image: "wide shot of industrial chimneys and a large oil refinery with storage tanks on the shore of the Gulf of Izmit, evening light"
      - say: "Rafineriler, fabrikalar, tersaneler."
        image: "medium shot of factory workers in blue overalls leaving a factory gate at shift change, 1999 Turkey"
      - say: "Ve bu kıyının altından bir fay geçiyor."
        image: "cinematic cutaway illustration of the ground beneath a coastal town, a long crack line running under the gulf, simple and educational, no damage"
      - say: "Kuzey Anadolu Fayı."
        overlay: "KUZEY ANADOLU FAYI"
        overlay_pos: bottom-left
        reuse: s02_04
        move: in
      - say: "Bu ülkede depremi herkes duymuş."
        image: "medium shot of an elderly man reading a newspaper at a seaside tea garden in 1999, glasses of tea on the table"
      - say: "Ama çoğu insan için uzak bir ihtimal. Hep başka şehirlerde, başka zamanlarda olan bir şey."
        reuse: s02_06
        move: out
      - say: "Bir hafta kadar önce bütün ülke başka bir şeye bakıyordu."
        image: "wide shot of a crowd in a Turkish town square in August 1999 looking up at the sky through dark eclipse glasses"
      - say: "On bir Ağustos'ta güneş tutuldu."
        image: "dramatic shot of a total solar eclipse, black disc with a glowing white corona in a dark blue sky"
        overlay: "11 AĞUSTOS"
        overlay_pos: top-right
      - say: "Karadeniz'den güneydoğuya uzanan bir şeritte gündüz gece oldu."
        reuse: s02_09
        move: in
      - say: "Sen de karton gözlükle balkondan baktın."
        image: "medium shot of {SEN} on the balcony in daylight wearing cardboard eclipse glasses, looking up, smiling"
      - say: "Gözlük hâlâ masanın üstünde duruyor."
        image: "close-up of cardboard eclipse glasses lying on a wooden desk next to a cassette tape and a notebook"

  - title: "Sıcak Bir Yaz Gecesi"
    scenes:
      - say: "Gece çok sıcak."
        image: "medium shot of a bedroom at night in summer 1999, window wide open, a white plastic fan blowing, thin curtains moving"
      - say: "Vantilatör sağa sola dönüyor ama sadece sıcak havayı bir köşeden öbür köşeye taşıyor."
        image: "close-up of an old oscillating desk fan turning its head slowly in a dark bedroom"
      - say: "Sokakta birkaç köpek havlıyor."
        image: "wide shot of an empty street at night in 1999 Turkey, two stray dogs barking toward the dark, street lamp"
      - say: "Sonra bir an sessizlik."
        reuse: s03_03
        move: in
      - say: "Kuşlar bile susmuş."
        image: "close-up of a tree branch outside a window at night, perfectly still, no birds, moonlight"
      - say: "Kardeşin yatakta dönüp duruyor."
        image: "medium shot of {KARDES} tossing in her bed, hugging her teddy bear, restless"
      - say: "Abi, uyuyamıyorum, diye mırıldanıyor. Sen de, uyu artık, diye homurdanıyorsun."
        reuse: s03_06
        move: in
      - say: "Sen de dönüp duvara bakıyorsun."
        image: "medium shot of {SEN} lying on his side in bed facing the wall, eyes open, dim blue night light"
      - say: "Duvarda bir futbol posteri."
        image: "close-up of a bedroom wall with a generic football team poster and a small shelf of cassettes, night light"
      - say: "Komodinin üstünde bir bardak su."
        image: "close-up of a glass of water on a bedside table, the water surface perfectly still"
      - say: "Saat üçe geliyor."
        image: "close-up of a digital alarm clock on a nightstand showing 02:59 in red digits"
        overlay: "02:59"
        overlay_pos: top-right
      - say: "Bardaktaki su hafifçe titriyor."
        reuse: s03_10
        move: in

  - title: "Saat Üçü İki Geçe"
    scenes:
      - say: "Saat üçü iki geçe."
        image: "extreme close-up of a digital alarm clock showing 03:02 in red digits, slightly blurred as if shaking"
        overlay: "03:02"
        overlay_pos: top-left
      - say: "Önce yerin altından, çok derinden gelen bir uğultu."
        image: "dark wide shot of the apartment building at night, a low rumble visualized as faint dust falling from the balconies, symbolic"
      - say: "Sokaktan ağır bir kamyon geçiyor sanıyorsun."
        image: "medium shot of {SEN} opening his eyes in bed in the dark, confused"
      - say: "Sonra yatak seni duvara fırlatıyor."
        image: "dynamic dark shot of a bedroom shaking, the bed sliding, curtains swinging wildly, books falling from a shelf, no injuries"
      - say: "Dolap kapakları açılıp kapanıyor."
        image: "close-up of wardrobe doors swinging open and shut in the dark, clothes hangers rattling"
      - say: "Bardak yere düşüyor, sesini duymuyorsun bile."
        image: "close-up of a glass of water falling from a bedside table in the dark, frozen mid-air"
      - say: "Çünkü bütün bina gürlüyor."
        image: "exterior night shot of the apartment building swaying under a dark sky, windows dark, symbolic motion lines, no collapse shown"
      - say: "Elektrikler gidiyor."
        image: "wide shot of a whole coastal town going dark at once, only the starry sky visible, silhouettes of buildings"
      - say: "Kapkaranlık."
        image: "almost completely black frame with a faint outline of a window frame and stars beyond"
      - say: "Annenin sesi koridordan geliyor."
        image: "dark hallway shot, {ANNE} holding onto a door frame, shouting toward the children's room, faint moonlight"
      - say: "Kapının pervazına tutun!"
        reuse: s04_10
        move: in
      - say: "Kardeşini kolundan çekip kapının yanına çöküyorsun."
        image: "dark medium shot of {SEN} crouching beside a doorway, shielding {KARDES} with his arms, the teddy bear between them"
      - say: "Sayıyorsun. Bir, iki, üç…"
        reuse: s04_12
        move: in
      - say: "Bitmiyor."
        image: "extreme close-up of {SEN} with eyes tightly shut in the dark, dust in the air"
      - say: "Kimi kaynağa göre otuz yedi, kimine göre kırk beş saniye."
        image: "symbolic dark image of a large stopwatch with its hand moving, dust particles floating in moonlight"
        overlay: "37–45 SANİYE"
        overlay_pos: top-right
      - say: "Ömrünün en uzun anı."
        reuse: s04_15
        move: in
      - say: "Ve birden her şey duruyor."
        image: "dark still bedroom after shaking, furniture shifted, a fallen shelf, dust slowly settling in a beam of moonlight, no people injured"

  - title: "Karanlıkta Merdivenler"
    scenes:
      - say: "Sessizlik. Sonra dışarıdan sesler."
        image: "wide night shot of a dark street, faint figures of people coming out of buildings, distant shouting implied, moonlight"
      - say: "Baban titreyen elleriyle bir çakmak yakıyor."
        image: "close-up of {BABA} in the dark holding up a small lighter flame, face lit from below, serious"
      - say: "Çıkıyoruz, hemen!"
        reuse: s05_02
        move: in
      - say: "Ayağınla terliğini arıyorsun."
        image: "close-up of a bare foot searching under a bed in the dark, one blue slipper found, the other missing"
      - say: "Bir tanesi elinde. Öbürü yok."
        image: "close-up of {SEN} holding a single blue slipper in the dark, confused"
        overlay: "TEK TERLİK"
        overlay_pos: bottom-right
      - say: "Tek terlikle merdivenlere koşuyorsun."
        image: "dark stairwell of an apartment building, {SEN} rushing down with one slipper on, holding {KARDES} by the hand, lighter glow"
      - say: "Duvarlarda çatlaklar, basamaklarda sıva parçaları."
        image: "close-up of cracked plaster on a stairwell wall and small debris on the steps, lit by a lighter flame"
      - say: "Üçüncü kattan Kemal Amca çıkıyor, elinde gaz lambası."
        image: "medium shot of {KEMAL_AMCA} in a stairwell holding an old kerosene lamp, guiding people down"
      - say: "Yavaş, yavaş, basamaklara bakın."
        reuse: s05_08
        move: in
      - say: "Bütün mahalle pijamayla, geceliklerle, battaniyelere sarılmış halde sokağa dökülüyor."
        image: "wide night shot of neighbors in pajamas and nightgowns standing in the middle of a street, holding blankets, moonlight"
      - say: "Kiminin ayağında ayakkabı, kiminin çıplak."
        image: "close-up of many feet on the asphalt at night, some in slippers, some barefoot, one man in mismatched shoes"
      - say: "Sen tek terliklisin."
        image: "close-up of {SEN} standing on the street with one slipper on and one bare foot, looking down"
      - say: "Kimse gülmüyor."
        reuse: s05_12
        move: out
      - say: "Yer hâlâ ara ara titriyor."
        image: "wide night shot of the street, people crouching and holding each other as a small aftershock hits, symbolic"

  - title: "Sesimi Duyan Var mı?"
    scenes:
      - say: "Gözlerin karanlığa alışınca sokağın ucuna bakıyorsun."
        image: "wide night shot of a residential street, one building in the distance partly collapsed shown only as a dark silhouette with dust, neighbors looking toward it, no bodies"
      - say: "Karşı sokaktaki apartman yok."
        reuse: s06_01
        move: in
      - say: "Ambulans yok. İtfaiye yok. Telefon yok."
        image: "close-up of a dark empty road junction at night, no vehicles, no lights, dust in the air"
      - say: "Kimse gelmiyor, çünkü kasabanın her köşesi aynı durumda."
        image: "wide aerial night view of the whole dark coastal town, several silhouettes of damaged buildings, no lights anywhere, symbolic"
      - say: "O yüzden çalışmaya komşular başlıyor."
        image: "medium night shot of neighbors in pajamas forming a line toward a pile of rubble, holding flashlights and a lamp"
        overlay: "KOMŞU"
        overlay_pos: top-left
      - say: "Kemal Amca beton parçalarını eliyle kaldırıyor."
        image: "medium shot of {KEMAL_AMCA} lifting a concrete chunk with both hands, lit by a flashlight held by someone else"
      - say: "Baban bir kova buluyor."
        image: "close-up of {BABA} passing a metal bucket full of rubble to another neighbor, human chain at night"
      - say: "Sen Kemal Amca'nın el fenerini tutuyorsun. Işığı oynatma, diyor."
        image: "medium shot of {SEN} holding a flashlight steady, beam pointing at a pile of rubble, focused"
      - say: "Biri bağırıyor: Sesimi duyan var mı?"
        image: "medium shot of a neighbor cupping his hands and shouting toward a pile of rubble at night"
      - say: "Herkes susuyor."
        image: "wide shot of neighbors frozen in silence around the rubble, flashlights pointed down, waiting"
      - say: "Çok derinden bir tıkırtı."
        image: "close-up of a small gap between concrete slabs, flashlight beam entering it, dust"
      - say: "Buradayız! Buradayız!"
        reuse: s06_11
        move: in
      - say: "Saatlerce kazıyorsunuz. Tırnaklar kırılıyor."
        image: "close-up of dusty hands carefully moving small stones, symbolic, no blood"
      - say: "Gün ağarırken bir el uzanıyor."
        image: "dawn light, a dusty hand reaching out from a gap between concrete slabs, neighbors' hands grabbing it gently, hopeful"
      - say: "Kemal Amca kurtardığı kadının elini bırakmadan oturup ağlıyor. Sevinçten."
        image: "medium shot of {KEMAL_AMCA} sitting on a pile of stones at dawn, face in his hands, a neighbor's hand on his shoulder"
      - say: "Bunu aklına yaz."
        image: "wide shot at dawn of exhausted neighbors sitting on the curb, covered in dust, one woman wrapped in a blanket, quietly relieved"
      - say: "Enkazdan yaklaşık elli bin kişi kurtarıldı."
        overlay: "≈50.000 KİŞİ"
        overlay_pos: top-right
        reuse: s06_16
        move: in
      - say: "Bunların yüzde doksan sekizini yöre halkı çıkardı."
        image: "symbolic illustration of a long human chain of ordinary neighbors in pajamas passing buckets at dawn"
        overlay: "%98 KOMŞULAR"
        overlay_pos: bottom-left

  - title: "Telefon Çalmıyor"
    scenes:
      - say: "Sabah olunca annenin aklına tek bir şey geliyor."
        image: "medium shot of {ANNE} sitting on a car hood at dawn, looking at a small address book, worried"
      - say: "İstanbul'daki teyzen."
        image: "close-up of an old address book open to a handwritten page with phone numbers"
      - say: "Ankesörlü telefona koşuyorsunuz."
        image: "medium shot of a long queue of people at an orange public pay phone on a damaged street in 1999, morning"
      - say: "Kart takılıyor. Hat yok."
        image: "close-up of a hand inserting a phone card into a 1999 Turkish pay phone, no dial tone, frustrated"
      - say: "Komşunun cep telefonunu deniyorsunuz."
        image: "close-up of a 1999 Nokia mobile phone held in a hand, screen showing no signal"
      - say: "Ekranda çizgi yok."
        reuse: s07_05
        move: in
      - say: "Batı Türkiye'nin elektriği saatlerce gitti."
        image: "wide shot of electricity pylons along a highway at dawn, dead power lines, no lights in distant towns"
      - say: "Telefonların düzelmesi iki ila beş günü buldu."
        overlay: "2–5 GÜN"
        overlay_pos: top-right
        reuse: s07_03
        move: out
      - say: "Bu arada İstanbul'da teyzen de aynı numarayı tekrar tekrar çeviriyor."
        image: "medium shot of a middle-aged woman in an Istanbul apartment dialing a home phone again and again, worried, morning light"
      - say: "Ulaşamıyor."
        reuse: s07_09
        move: in
      - say: "Pilli radyo bir arabanın tavanında."
        image: "close-up of a small battery radio on a car roof, people gathered around listening silently"
      - say: "Herkes nefesini tutup dinliyor."
        image: "wide shot of a group of neighbors standing around a car listening to a radio, morning, dusty street"
      - say: "Öğlene doğru bir komşunun telefonu birkaç saniyeliğine çekiyor. Teyzene tek cümle söyleyebiliyorsun: Yaşıyoruz."
        image: "close-up of {ANNE} pressing a mobile phone to her ear with both hands, eyes closed in relief, dusty street behind"

  - title: "Gün Ağarıyor"
    scenes:
      - say: "Güneş doğunca gecenin karanlığında görmediğin şeyler tek tek ortaya çıkıyor."
        image: "wide morning shot of a coastal town in the Gulf of Izmit with several damaged buildings in the distance, dust haze, people walking slowly, no bodies"
      - say: "Deprem Ankara'dan İzmir'e kadar hissedildi."
        image: "simple illustrated map of western Turkey with concentric circles from the Gulf of Izmit reaching Ankara and Izmir"
        overlay: "ANKARA – İZMİR"
        overlay_pos: bottom-right
      - say: "Depremin büyüklüğü için bile bugün hâlâ tek bir rakam yok."
        image: "close-up of a seismograph drum with wild ink lines on paper"
      - say: "İlk açıklamada yedi nokta dört."
        overlay: "7.4"
        overlay_pos: top-left
        reuse: s08_03
        move: in
      - say: "Kandilli'ye göre yedi nokta sekiz."
        overlay: "7.8"
        overlay_pos: top-right
        reuse: s08_03
        move: out
      - say: "Kıyıda bazı sokaklar sular altında."
        image: "wide morning shot of a seaside street partly flooded by the sea, a park bench half in water, calm surface"
      - say: "Deniz, gece karaya girmiş."
        reuse: s08_06
        move: in
      - say: "Ufukta kara bir duman yükseliyor."
        image: "wide shot of a huge black smoke column rising from a coastal oil refinery across the gulf, morning sky"
      - say: "Rafineride tanklar yanıyor."
        image: "medium shot of large oil storage tanks burning in the distance, firefighting boats spraying water, no people harmed"
      - say: "Baban dumana bakıp hiçbir şey demiyor. Sadece kardeşinin elini daha sıkı tutuyor."
        image: "medium shot from behind of {BABA} holding {KARDES} by the hand, both looking at a distant black smoke column across the gulf"
      - say: "Çevresi beş kilometre boşaltılıyor."
        overlay: "5 KM"
        overlay_pos: top-right
        reuse: s08_08
        move: in
      - say: "Yangın ancak beş gün sonra kontrol altına alınacak."
        image: "time-lapse style shot of the refinery smoke column under day and night skies, symbolic"
      - say: "Bu arada senin aklında hâlâ tek terlik var."
        image: "close-up of {SEN} sitting on a curb looking at his one bare foot, dusty, a small sad smile"

  - title: "Komşu Ülkeden Gelenler"
    scenes:
      - say: "İkinci gün mahallede hiç görmediğin plakalarla araçlar beliriyor."
        image: "medium shot of a convoy of rescue vehicles and trucks with foreign rescue team logos entering a dusty Turkish town street"
      - say: "Yirmiden fazla ülkeden kurtarma ekipleri."
        image: "wide shot of rescue workers in different colored uniforms with helmets gathering at a meeting point, maps on a car hood"
        overlay: "20+ ÜLKE"
        overlay_pos: top-left
      - say: "İlk iki günde bin kadar yabancı kurtarmacı geliyor."
        reuse: s09_02
        move: in
      - say: "Bir de AKUT var."
        image: "medium shot of Turkish volunteer rescuers in orange suits and helmets carrying ropes and tools"
      - say: "O yıl yüz elli kadar daimi üyesi olan küçük bir dernek."
        reuse: s09_04
        move: in
      - say: "O günlerde bini aşkın yardımcıyı yönetiyor."
        image: "wide shot of a volunteer coordinator with a megaphone directing dozens of civilian helpers at dawn"
      - say: "Ve ekipler arasında bir şaşırtıcı isim var."
        image: "close-up of a rescue dog with a vest sitting beside its handler, waiting for a command"
      - say: "Yunanistan."
        image: "medium shot of a Greek rescue team in helmets unloading equipment from a truck, two search dogs with them, Turkish neighbors watching"
      - say: "Yirmi dört kişilik ekip, iki arama köpeği."
        overlay: "24 KİŞİ + 2 KÖPEK"
        overlay_pos: bottom-left
        reuse: s09_08
        move: in
      - say: "Yangın için söndürme uçakları."
        image: "wide shot of a yellow firefighting airplane dropping water over a burning refinery, black smoke"
      - say: "Atina'da, Selanik'te depremzedeler için kan veriliyor."
        image: "medium shot of people lining up at a blood donation tent in a Greek city square, 1999"
      - say: "Üç hafta sonra Atina sallanıyor."
        image: "wide shot of Athens with the Acropolis in the distance, a damaged building in the foreground, rescuers working, no injuries shown"
        overlay: "7 EYLÜL 1999"
        overlay_pos: top-left
      - say: "Bu kez on üç saat içinde oraya Türk ekibi yetişiyor."
        image: "medium shot of a Turkish rescue team stepping off a military transport plane at night, carrying equipment"
      - say: "Gazeteler buna deprem diplomasisi diyecek."
        image: "close-up of two newspapers side by side on a table, one Greek and one Turkish, both with photos of rescuers"

  - title: "Çadırkent"
    scenes:
      - say: "Bina hasarlı. Eve geri giremiyorsunuz."
        image: "medium shot of {BABA} looking at a large crack in the facade of the family apartment building, worried"
      - say: "İki yüz bin kişi evsiz kalıyor."
        image: "wide shot of a field filling with white tents, families carrying blankets and bags, summer 1999"
        overlay: "200.000 EVSİZ"
        overlay_pos: top-right
      - say: "Sizin yeni adresiniz: bir futbol sahasına kurulmuş, numaralı beyaz bir çadır."
        image: "medium shot of the family standing in front of a white relief tent with a number painted on it, {KARDES} holding her teddy bear"
      - say: "Çadırın içi gündüz fırın."
        image: "interior of a hot crowded tent in daylight, sunlight glowing through canvas, blankets folded, a water bottle"
      - say: "Gece ise herkes birbirine sokuluyor."
        image: "interior of a tent at night, family sleeping close together under blankets, a flashlight hanging from the tent pole"
      - say: "Uyumak zor. Her sarsıntıda dışarı fırlıyorsunuz."
        image: "night shot of people rushing out of tents during a small aftershock, holding flashlights"
      - say: "Kemal Amca bitişik çadırda."
        image: "medium shot of {KEMAL_AMCA} sitting on a stool in front of his tent, brewing tea on a small camping stove"
      - say: "Sabahları ocağını yakıp bütün sıraya çay dağıtıyor. Şekerini kendin getir, diyor."
        reuse: s10_07
        move: in
      - say: "Yardım tırından ayağına uygun bir ayakkabı buluyorsun."
        image: "medium shot of {SEN} holding up a pair of mismatched donated sneakers from a pile of donated clothes, smiling a little"
      - say: "Bir numara büyük. Olsun."
        image: "close-up of {SEN} wearing oversized sneakers, the single old blue slipper tucked into his backpack pocket"
      - say: "Terliği atmıyorsun."
        reuse: s10_10
        move: in
      - say: "Sonbahar geliyor, yağmurlar başlıyor, çadırların arası çamura dönüyor."
        image: "wide shot of a muddy tent city in autumn rain, tents sagging, people carrying buckets"
      - say: "Ekim sonunda gazeteler tek çadırda yaşayan on beş kişilik bir aileyi yazıyor."
        image: "interior of a crowded tent with many family members of all ages sitting on blankets, damp and cold"
        overlay: "15 KİŞİ, 1 ÇADIR"
        overlay_pos: bottom-left
      - say: "Lise son sınıfın derslerine çadırda, el feneriyle çalışıyorsun."
        image: "medium shot of {SEN} reading a school book by flashlight inside a tent, raindrops on the canvas"

  - title: "Bir Sarsıntı Daha"
    scenes:
      - say: "On iki Kasım, akşam yemeği saati."
        image: "evening shot of a tent city, families gathered around small stoves, children playing between tents"
        overlay: "12 KASIM 1999"
        overlay_pos: top-left
      - say: "Yer yine sallanıyor."
        reuse: s11_01
        move: in
      - say: "Bu kez merkez Düzce."
        image: "simple illustrated map of northwestern Turkey with a marker on Duzce, east of the Gulf of Izmit"
      - say: "Yedi nokta iki büyüklüğünde."
        overlay: "7.2"
        overlay_pos: top-right
        reuse: s11_03
        move: in
      - say: "En az sekiz yüz kırk beş kişi hayatını kaybediyor."
        image: "symbolic shot of candles lit on a stone wall at night in a small town, quiet mourning"
      - say: "Düzce ayrı bir video konusu."
        image: "medium shot of {SEN} sitting on a crate in front of the tent at night, wrapped in a blanket, looking east"
      - say: "Ama o gece çadırkentte kimse uyumuyor."
        image: "wide night shot of a tent city with lights on in every tent, people sitting outside, cold breath visible"

  - title: "Kapıdışarı 99"
    scenes:
      - say: "Kış yaklaşırken prefabrik evler kuruluyor."
        image: "wide shot of rows of identical white prefabricated houses being assembled on a field, cranes and workers, winter 1999"
      - say: "Kırk bin yedi yüz seksen altı prefabrik konut."
        overlay: "40.786 PREFABRİK"
        overlay_pos: top-right
        reuse: s12_01
        move: in
      - say: "Yüz kırk yedi bin kişi buralara yerleşiyor."
        image: "medium shot of families carrying boxes into a small prefabricated house, children running ahead"
      - say: "Size iki odalı, sobalı, tenekeden bir kutu düşüyor."
        image: "interior of a small prefabricated house, a stove, two mattresses, a folding table, a small television"
      - say: "Duvarlar ince. Komşunun öksürüğü sizin salonda."
        image: "medium shot of {BABA} looking at the thin wall with a funny tired face while a neighbor coughs on the other side"
      - say: "Ama içerisi kuru. Bu yetiyor."
        reuse: s12_04
        move: in
      - say: "Ve takvim bin dokuz yüz doksan dokuzun son gününü gösteriyor."
        image: "close-up of a paper wall calendar showing 31 December 1999, hanging on a prefabricated house wall"
        overlay: "31 ARALIK 1999"
        overlay_pos: top-left
      - say: "Televizyonda bütün dünya milenyumu, iki bin yılını kutluyor."
        image: "small television screen showing fireworks over a city skyline, in a prefabricated house living room"
      - say: "Depremin üstünden yüz otuz sekiz gün geçmiş."
        overlay: "138 GÜN"
        overlay_pos: top-right
        reuse: s12_08
        move: in
      - say: "Ramazan ayı. Herkes iftardan sonra çay başında."
        image: "medium shot of the family and {KEMAL_AMCA} sitting around a small table with tea glasses and dates inside a prefab house at night"
      - say: "Askerler çocuklara oyuncak dağıtıyor."
        image: "medium shot of Turkish soldiers handing wrapped toys to happy children in front of prefabricated houses"
      - say: "Bir aile kapısına pankart asmış."
        image: "close-up of a handmade cloth banner hung on a prefabricated house door that reads 'KAPIDIŞARI 99', lit by a porch lamp"
      - say: "Kapıdışarı doksan dokuz."
        overlay: "KAPIDIŞARI 99"
        overlay_pos: bottom-left
        reuse: s12_12
        move: in
      - say: "İlk kez gülüyorsun. Sonra ağlıyorsun. Sonra yine gülüyorsun."
        image: "medium shot of {SEN} smiling warmly inside a small prefabricated house at night, {KARDES} hugging him from the side, warm lamp light, cozy and hopeful"

  - title: "Planı Hatırlıyor musun?"
    scenes:
      - say: "Planı hatırlıyor musun?"
        reuse: s01_09
        move: in
      - say: "Sabah erkenden denize."
        reuse: s01_11
        move: out
      - say: "Deniz o gece kendisi geldi."
        reuse: s08_06
        move: out
      - say: "Sen ise denize ancak ertesi yaz gidebildin."
        image: "medium shot of {SEN} a year later standing on a pebble beach, wearing proper sneakers, looking at the calm gulf, quiet"
      - say: "Ayağında kendi ayakkabıların."
        image: "close-up of a pair of new sneakers on a pebble beach, the old single blue slipper placed beside them"
      - say: "Ve cebinde o tek terlik."
        reuse: s13_05
        move: in

  - title: "Bugün"
    scenes:
      - say: "Peki aradan yirmi yedi yıl geçti. O gece geride ne bıraktı?"
        image: "wide modern-day shot of the Gulf of Izmit, rebuilt coastal town with newer buildings, sunny day"
        overlay: "BUGÜN"
        overlay_pos: top-left
      - say: "Resmî kayıtlara göre on yedi binden fazla insan hayatını kaybetti."
        image: "symbolic shot of a quiet memorial with white flowers and candles by the sea at dusk"
        overlay: "17.000+"
        overlay_pos: top-right
      - say: "Kimi kaynak bu sayının çok daha yüksek olduğunu söylüyor."
        reuse: s14_02
        move: in
      - say: "Depremden sonra yapı denetimi yasası çıktı."
        image: "medium shot of a construction inspector in a hard hat checking steel reinforcement bars at a modern building site"
      - say: "İki bin birde on dokuz ilde başladı, iki bin on birde seksen bir ile yayıldı."
        overlay: "2001 → 2011"
        overlay_pos: bottom-left
        reuse: s14_04
        move: in
      - say: "Zorunlu deprem sigortası iki binde kuruldu."
        image: "close-up of an insurance policy document on a kitchen table next to house keys, modern day"
      - say: "İki bin yirmi dört itibarıyla evlerin yaklaşık yüzde kırk üçünde hâlâ yok."
        overlay: "%43 SİGORTASIZ"
        overlay_pos: top-right
        reuse: s14_06
        move: in
      - say: "AFAD deprem çantasına düdük ve el feneri koymanı söylüyor."
        image: "close-up of an emergency backpack opened on a bed, a whistle, a flashlight, water bottles and a first aid kit"
      - say: "Bizden de küçük bir ek."
        reuse: s14_08
        move: out
      - say: "Yatağının yanına bir çift ayakkabı."
        image: "close-up of a pair of shoes placed neatly beside a modern bed, a flashlight next to them, soft night light"
      - say: "Tek terlik değil. Bir çift."
        overlay: "BİR ÇİFT"
        overlay_pos: bottom-right
        reuse: s14_10
        move: in
      - say: "Ama bu videodan aklında tek bir şey kalacaksa, o şu olsun."
        image: "wide shot of a modern apartment hallway with several doors, neighbors greeting each other, warm light"
      - say: "O gece enkazdan çıkanların neredeyse hepsini ambulans değil, komşular çıkardı."
        reuse: s06_18
        move: in
      - say: "Kapı komşunun adını biliyor musun?"
        image: "medium shot of {SEN} as a 44-year-old man today, white round head, dot eyes, grey at temples, knocking on a neighbor's door holding a plate of food, smiling"

  - title: "Senin Hikâyen"
    scenes:
      - say: "Sen ya da ailen o geceyi nasıl yaşadınız?"
        image: "warm shot of an old family photo album open on a table, a 1999 photo of a family in front of a tent"
      - say: "Neredeydiniz, kim kapınızı çaldı?"
        reuse: s15_01
        move: in
      - say: "Yorumlara yaz, birlikte hatırlayalım."
        image: "medium shot of {SEN} as an adult sitting by a window at night, the old single blue slipper on the windowsill"
      - say: "Bir de kanala abone ol."
        image: "close-up of the old single blue slipper on a windowsill, moonlight, quiet"
      - say: "Bir sonraki yıla seni de götürelim."
        reuse: s15_04
        move: in
      - say: "Ama bu kez iki terlikle."
        image: "close-up of a matching pair of blue slippers side by side under a bed, soft morning light"
