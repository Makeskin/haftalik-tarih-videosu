# O Yıl Sen — Bölüm 6: Asker Annesi
title: "Eğer 80'lerde Oğlunu Askere Yollayan Bir Anne Olsaydın?"
motif: "Su — kapıdan oğlunun arkasından dökülen bir tas su; dönüş gününde yeniden. Tekrar eden şaka: annenin bitmeyen yün çorapları ('Anne, çorap yeter')."
characters:
  SEN: "a 44-year-old Turkish mother in a small Anatolian town in 1984, white round head, dot eyes, white cotton headscarf tied under the chin, long dark floral skirt, knitted brown cardigan"
  SEN_YASLI: "an 86-year-old Turkish grandmother in 2026, white round head, dot eyes, white headscarf, thick glasses, knitted grey cardigan, knitting needles in hand"
  OGLUN: "a 20-year-old Turkish young man in 1984, white round head, dot eyes, short dark hair, thin mustache, checked shirt and dark trousers"
  OGLUN_ASKER: "a 20-year-old Turkish conscript soldier in 1984, white round head, dot eyes, very short shaved hair, olive green army uniform and cap"
  KIZIN: "a 15-year-old Turkish girl in 1984, white round head, dot eyes, long braid, plain blue dress with a cardigan"
  KOCAN: "a 48-year-old Turkish man in a small Anatolian town in 1984, white round head, dot eyes, grey mustache, flat cap, dark wool jacket"
  POSTACI: "a 1980s Turkish postman, white round head, dot eyes, mustache, navy blue PTT uniform and cap, leather mail bag"
  TORUNUN: "a 20-year-old Turkish young man in 2026, white round head, dot eyes, short hair, hoodie and jeans, smartphone in hand"
youtube:
  title: "Eğer 80'lerde Oğlunu Askere Yollayan Bir Anne Olsaydın?"
  description: |-
    1984 yazı. Oğlunun eline kına yakıyorsun, bavuluna üç çift yün çorap koyuyorsun ve otobüs kalkarken arkasından bir tas su döküyorsun. Önünde on sekiz ay var. Evinde telefon yok, mektup haftalar sürüyor, kura sonucu bir zarfla geliyor.

    Bu videoda askerlik hikâyesini kışladan değil, evden anlatıyoruz: asker uğurlaması, "su gibi git su gibi gel", komşunun telefonu ve PTT'de şehirlerarası sırası, yedi yıl süren telefon bekleme listeleri, yemin töreni yolculuğu, çorap dolu koliler, radyodaki asker türküleri ve bugünün altı aylık askerliğiyle karşılaştırması.

    Senin annen de arkandan su döktü mü? Ya da sen birinin arkasından döktün mü? Hikâyeni yorumlara yaz.

    Not: Hikâye kurgusal bir annenin gözünden anlatılır; videodaki tarih ve rakamlar kaynaklara dayanır. Görseller ve seslendirme yapay zekâ ile üretilmiştir.
