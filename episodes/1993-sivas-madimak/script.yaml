sections:
- title: Haziran 1993, Ankara
  scenes:
  - say: Ankara. Haziran'ın son günleri, bin dokuz yüz doksan üç.
    image: wide shot of a hillside Ankara neighborhood of small single-storey houses with tiled roofs in summer 1993, warm evening light, a few satellite dishes, children playing far away
    overlay: HAZİRAN 1993
    overlay_pos: top-left
  - say: Küçük bir evin küçük bir odası.
    image: medium shot of a modest 1993 Turkish living room, floral sofa cover, a crocheted doily on a wooden cabinet, an old television, warm lamp light
  - say: Annen dolaptan bir yazma çıkarıyor.
    image: medium shot of {ANNE} taking a neatly folded white headscarf out of an old wooden wardrobe, gentle smile
  - say: Kenarında el emeği, rengârenk bir oya.
    image: close-up of a white cotton headscarf edged with colorful handmade needle-lace flowers in red, yellow and green, on a wooden table
  - say: 'Bu kelimeyi aklında tut: yazma.'
    overlay: YAZMA
    overlay_pos: bottom-right
    reuse: s01_04
    move: in
  - say: Yazmayı başına bağlıyor, seni aynaya çeviriyor.
    image: medium shot of {SEN} looking into a wall mirror while {ANNE} ties the white lace-edged headscarf on her head from behind, both smiling
  - say: Sen on yedi yaşındasın.
    image: medium shot of {SEN} wearing the white lace-edged headscarf, proud and a little shy, warm light
  - say: İki yıldır semah dönüyorsun.
    image: medium shot of {SEN} practicing a semah turn in the small living room, arms open, one palm up and one palm down, skirt swirling
  - say: Yarın sabah ilk kez Sivas'a gidiyorsun.
    image: medium shot of {SEN} packing a small travel bag on a bed, the white headscarf folded on top
  - say: Pir Sultan Abdal'ın memleketine.
    image: wide shot of the golden Central Anatolian steppe in summer, soft hills, a small village far away, big blue sky
  - say: Bir şenlikte, yüzlerce kişinin önünde semah döneceksin.
    image: medium shot of a group of young semah dancers in white and red rehearsing in a circle in a community hall, a baglama player sitting at the side
  - say: Tebrikler. Hayatının en güzel yazı başlıyor.
    image: close-up of {SEN} smiling brightly at an open window, summer evening light
  - say: Öyle sanıyorsun.
    reuse: s01_12
    move: in
  - say: Üç gün sonra bu yazmayı ağzına tutup bir binadan kaçacaksın.
    image: close-up of the white lace-edged headscarf lying on a dark wooden floor, faint orange light from the edge of the frame, somber, no fire visible
  - say: Otuz beş kişi o binadan çıkamayacak.
    image: symbolic shot of thirty-five small candles burning in a row in the dark, quiet, respectful
    overlay: '35'
    overlay_pos: top-right
  - say: Ve bir gün bir mahkeme 'zamanaşımı' diyecek.
    image: close-up of a wooden judge's gavel on a desk in a dim courtroom, cold light
    overlay: ZAMANAŞIMI
    overlay_pos: bottom-left
  - say: Hadi. Yazmayı katla, çantaya koy.
    image: close-up of {SEN}'s hands folding the white lace-edged headscarf and placing it in a small travel bag
- title: Önce Biraz Arka Plan
  scenes:
  - say: Önce biraz arka plan.
    image: close-up of a stack of folded 1993 Turkish newspapers on a coffee table next to a glass of tea, no readable text
    overlay: '1993'
    overlay_pos: top-left
  - say: Türkiye'de yeni bir hükümet var.
    image: wide shot of the Turkish Grand National Assembly building in Ankara on a sunny summer day in 1993
  - say: Daha bir haftalık.
    image: close-up of a paper wall calendar in an office showing the last week of June, one day circled, no readable text
  - say: Başbakan, ülkenin ilk kadın başbakanı.
    image: close-up of a 1990s CRT television in a living room showing a blurry news broadcast of a distant podium with microphones, no recognizable face
  - say: Cumhurbaşkanı da bir buçuk ay önce değişmiş.
    image: wide shot of the gate of a presidential mansion in Ankara with two honor guards, summer 1993
  - say: Ama asıl hikâye Ankara'da değil, Sivas'ta.
    image: a simple stylized map of Turkey with a dotted line drawn from Ankara east to Sivas, no text
  - say: Her yıl Pir Sultan Abdal adına bir kültür şenliği yapılıyor.
    image: wide shot of a festival courtyard in summer with colorful plain bunting, folding chairs and a small stage, no text
  - say: Bu yıl dördüncüsü.
    overlay: 4. ŞENLİK
    overlay_pos: top-right
    reuse: s02_07
    move: in
  - say: 'Ve bir ilk var: Devlet bu kez şenliğe destek veriyor.'
    image: wide shot of a stone provincial government building in Sivas in 1993 with a Turkish flag, sunny day
  - say: Konukları Sivas valisi davet etmiş.
    image: close-up of an official invitation envelope with a wax-like seal on a desk, no readable text
  - say: Program iki gün şehir merkezinde, iki gün Banaz köyünde.
    image: wide shot of a small Anatolian village on a hillside with earthen houses and poplar trees in summer
  - say: Banaz, Pir Sultan'ın doğduğu köy.
    image: close-up of an old stone village fountain under a poplar tree, water running, summer light
- title: Sivas Yolu
  scenes:
  - say: Ertesi sabah otogardasın.
    image: wide shot of a busy Ankara intercity bus terminal in 1993, old white coaches, travelers with bags, morning light
  - say: Baban elinde bir poşet poğaçayla koşturuyor.
    image: medium shot of {BABA} hurrying across the bus terminal holding a small plastic bag of pastries
  - say: Annen son kez tembihliyor.
    image: medium shot of {ANNE} talking to {SEN} beside the bus, one finger raised, caring
  - say: Hırkanı al. Sivas'ın akşamı soğuk olur.
    image: close-up of {ANNE}'s hands pushing a pale blue knitted cardigan into {SEN}'s arms
  - say: Temmuz'da hırka mı, diye gülüyorsun.
    image: close-up of {SEN} laughing, holding the cardigan
  - say: Kardeşin camın önünde el sallıyor.
    image: medium shot of {KARDES} waving outside the bus window, {BABA} behind him
  - say: 'Çantanda üç şey var: yazma, hırka ve dönüş bileti.'
    image: close-up of an open travel bag with the folded lace-edged headscarf, the pale blue cardigan and a small paper bus ticket
  - say: Semah hocan arka koltukta, sazı kucağında.
    image: medium shot of {HOCA} sitting in a bus seat holding a baglama in a cloth case on his lap, smiling
  - say: Ekipten gençler türkü söylüyor.
    image: medium shot of several teenagers on an old bus singing and clapping, sunlight through the windows
  - say: Yol boyunca bozkır sapsarı.
    image: wide shot through a bus window of the yellow Anatolian steppe and a straight road in summer
  - say: Sivas'a vardığınızda güneş hâlâ tepede.
    image: wide shot of Sivas in summer 1993, low buildings, old Seljuk minarets in the distance, bright afternoon
  - say: Ama annen haklı çıkacak.
    reuse: s03_04
    move: in
  - say: Burada Temmuz geceleri ortalama on iki dereceye kadar iniyor.
    image: wide shot of Sivas at dusk, cool blue light, people walking in light jackets
    overlay: GECE 12°C
    overlay_pos: top-right
  - say: Ekip olarak bir ailenin evinde kalıyorsunuz.
    image: medium shot of {EV_SAHIBI} laying out floor mattresses in a simple Sivas house for several teenage girls, {SEN} among them, warm light
- title: '1 Temmuz: Şenlik'
  scenes:
  - say: Bir Temmuz. Kültür Merkezi.
    image: wide shot of a large modern cultural centre in Sivas in 1993, people streaming in through the doors, sunny day
    overlay: 1 TEMMUZ
    overlay_pos: top-left
  - say: Salon yaklaşık iki bin kişilik. Boş koltuk yok.
    image: wide shot of a packed auditorium seen from the back rows, every seat full, warm stage lights
    overlay: 2.000 KİŞİ
    overlay_pos: top-right
  - say: Ozanlar, yazarlar, karikatüristler, tiyatrocular.
    image: medium shot of a crowded foyer, men with baglama cases, a woman with a notebook, young actors in costume, cheerful
  - say: Fuayede kitap ve fotoğraf sergisi.
    image: medium shot of a small exhibition with framed black and white photographs and tables of books, visitors browsing
  - say: Sen bir köşede, dönüşleri kafandan geçiriyorsun.
    image: medium shot of {SEN} sitting on a bench in a corner of the foyer, eyes closed, counting steps with her fingers
  - say: Kapının önünde yeni bir heykel var.
    image: medium shot of a bronze statue of a folk poet holding a baglama on a stone pedestal in front of a cultural centre, sunny day
  - say: Kaidesine daha yeni konmuş.
    image: close-up of fresh grey cement at the base of a stone pedestal, a trowel left beside it
  - say: Herkes ona aynı gözle bakmıyor.
    image: wide shot of passersby on the street glancing at the new statue from a distance, mixed expressions, no faces in detail
  - say: 'Akşamüstü salonda bir yazar konuşuyor: Aziz Nesin.'
    image: wide shot of a conference hall stage seen from far behind the audience, an elderly speaker at a small podium, too far to be recognizable
  - say: Baban onun mizah yazılarını okuyup kahkaha atardı.
    image: medium shot of {BABA} in an armchair at home laughing while reading a book, a glass of tea beside him
  - say: Ama bu şehirde onun adı başka bir şeyle anılıyor.
    reuse: s04_09
    move: in
  - say: Bir kitapla.
    image: close-up of a closed hardcover book on a dark wooden table, no title visible, a single beam of light
- title: Bir Kitap, İki Anlatı
  scenes:
  - say: Salman Rushdie'nin Şeytan Ayetleri.
    overlay: ŞEYTAN AYETLERİ
    overlay_pos: top-left
    reuse: s04_12
    move: in
  - say: Roman İslam dünyasında inanca hakaret sayılıp büyük tepki çekmiş.
    image: wide shot of a quiet Ottoman mosque courtyard in Sivas with a fountain, afternoon light, peaceful
  - say: Aziz Nesin romanı Türkçeye çevirme girişimiyle aylardır hedefte.
    reuse: s04_12
    move: out
  - say: Tehditler gelince devlet ona polis koruması öneriyor.
    image: medium shot of a 1993 Turkish police car parked outside an apartment building in Istanbul, daytime
  - say: Önce reddediyor. Mart'ta koruma veriliyor.
    image: medium shot of a plainclothes police officer standing guard at the entrance of an apartment building, 1993
  - say: Konuşması ertesi gün gazetelere farklı yansıyor.
    image: close-up of several 1993 newspapers hanging at a kiosk, blurry headlines, no readable text
  - say: Bir gazeteye göre Kur'an'a inanmadığını söylemiş.
    reuse: s05_06
    move: in
  - say: Bir başkasına göre kendine dinsiz demiş.
    image: close-up of an older man at a teahouse lowering his newspaper and shaking his head
  - say: Bazı yazarlar ise sözlerin yerel basında abartıldığını savunuyor.
    image: medium shot of two men reading newspapers at a teahouse table, frowning in disagreement
  - say: Peki o gün olanların sebebi bu muydu? Burada iki anlatı var.
    image: close-up of old brass scales of justice on a desk, balanced, soft light
    overlay: İKİ ANLATI
    overlay_pos: bottom-right
  - say: Birincisine göre ortada bir tahrik vardı.
    image: close-up of brass scales of justice tipping to the left, soft light
  - say: Dönemin İçişleri Bakanı olayları Nesin'in tahrikine bağladı.
    image: close-up of a 1990s radio on a kitchen shelf, a family listening in the background
  - say: İlk mahkeme kararı da sanıklara 'ağır tahrik' indirimi verdi.
    image: wide shot of a 1990s Turkish courtroom with wooden benches, judges' bench, cold light, no recognizable people
  - say: İkincisine göre öfke günler önceden hazırlanmıştı.
    image: close-up of brass scales of justice tipping to the right, soft light
  - say: Olaylardan önceki günlerde şehirde tehdit içerikli bildiriler dağıtıldı.
    image: close-up of scattered printed leaflets lying on a cobblestone pavement, text not readable
    overlay: BİLDİRİLER
    overlay_pos: top-right
  - say: Meclis komisyonuna göre o sabah istihbarat planlanan bir eylemi haber verdi.
    image: medium shot of a 1993 government office, a ringing rotary telephone on a desk, files piled up
  - say: Önlem alınmadı.
    image: close-up of an unopened file folder on a desk under a lamp, a cold cup of tea beside it
  - say: Yargıtay da sonunda 'tahrik' indirimini bozdu.
    reuse: s05_13
    move: in
  - say: Olayı Cumhuriyete ve laikliğe yönelik bir saldırı saydı.
    image: wide shot of a grand stone courthouse in Ankara with a Turkish flag, overcast sky
  - say: 'Kesin olan şu: Nesin o akşam kurtulacak. Ölenlerin çoğu ise gençti.'
    image: close-up of {SEN} looking out of a window, thoughtful, the folded headscarf in her lap
- title: 2 Temmuz, Cuma
  scenes:
  - say: İki Temmuz, Cuma.
    image: wide shot of a Sivas street on a sunny Friday morning in July 1993, shops opening, quiet
    overlay: 2 TEMMUZ 1993
    overlay_pos: top-left
  - say: Ev sahibi teyze kahvaltıda çay dolduruyor.
    image: medium shot of {EV_SAHIBI} pouring tea for the girls at a low breakfast table with bread, cheese and olives
  - say: Bugün sahneye sen de çıkacaksın.
    image: close-up of {SEN} smiling over her tea glass, excited
  - say: Yazmayı ütülemişsin bile.
    image: close-up of an old iron gently pressing the white lace-edged headscarf on a folded blanket
  - say: Gün içinde Kültür Merkezi'ne taş ve sopayla saldırılıyor.
    image: close-up of a cracked glass door of a cultural centre, small stones on the steps, no people
  - say: Polis durduruyor. Program devam ediyor.
    image: medium shot of a few 1993 Turkish police officers standing on the steps of a cultural centre, calm again
  - say: Cuma namazından sonra vilayet önünde bir kalabalık toplanıyor.
    image: wide high shot of a crowd gathering in a city square in front of an old government building, seen from far away, small silhouettes, no faces
  - say: Valinin raporuna göre saat bir buçukta yaklaşık beş yüz kişi.
    overlay: '13.30'
    overlay_pos: top-right
    reuse: s06_07
    move: in
  - say: 'Sloganlardan biri: ''Vali istifa.'''
    image: close-up from behind of a hand-painted cloth banner held up in a crowd, text not readable
    overlay: VALİ İSTİFA
    overlay_pos: bottom-left
  - say: Saat ikide salonda konser başlıyor.
    image: wide shot of a concert stage with a baglama player and musicians seen from the audience, warm stage lights
  - say: Sazlar çalarken dışarıdaki uğultuyu duymuyorsun.
    image: medium shot of {SEN} in the audience clapping along, happy, unaware
  - say: Bir kaynağa göre vali öğleden sonra iki kez Ankara'yı arıyor.
    image: close-up of a man's hand holding a black rotary telephone receiver in an office, tense
- title: İptal
  scenes:
  - say: Sonra hocan yanınıza geliyor. Yüzü bembeyaz.
    image: medium shot of {HOCA} walking towards the group of girls in the foyer, worried face
  - say: Şenlik iptal.
    image: close-up of a folded printed festival program left on an empty auditorium seat, no readable text
    overlay: İPTAL
    overlay_pos: top-right
  - say: Ertesi gün Banaz'a geçilecek.
    reuse: s02_11
    move: out
  - say: Sahneye çıkamadın. Yazma hâlâ çantanda.
    image: close-up of the folded lace-edged headscarf inside a bag, untouched
  - say: Katılımcılar otobüslerle otele taşınıyor.
    image: medium shot of an old city bus with people boarding hurriedly in front of a cultural centre, late afternoon
  - say: Siz de biniyorsunuz. Ev uzak, otel güvenli görünüyor.
    image: medium shot of {SEN} and {HOCA} sitting inside the bus, {SEN} holding her bag tight
