  image: a Turkish teenage girl in 1993 with a long dark braid and a pale blue cardigan, standing on a quiet street in Sivas at dusk, holding a folded white headscarf with colorful needle-lace edging close to her chest, faint grey smoke in the evening sky far behind her, somber, emotional, cinematic, no violence, no fire, no crowd
