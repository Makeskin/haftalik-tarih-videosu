# O Yıl Sen — 2 Temmuz 1993, Sivas
# Kurgu: kız, aile, semah hocası ve ev sahibi kurgusaldır. Olaylar, saatler ve rakamlar arastirma.md'deki kaynaklara dayanır.
# Hukuki çizgi: kesinleşmiş yargı kararı olmayan hiçbir suçlama isimle yapılmaz. Sanık adı verilmez.
title: Eğer 2 Temmuz 1993'te Sivas'ta Semah Dönen Bir Genç Olsaydın?
motif: 'Yazma — annenin semah için verdiği oyalı yazma; ütülenir, sahneye çıkamaz, dumanda ağza tutulur, yıllarca dolapta kalır, sonunda anmada karanfillerin yanına bırakılır. Küçük callback: ''Sivas''ın akşamı soğuk olur'' hırkası.'
characters:
  SEN: a 17-year-old Turkish girl in summer 1993, white round head, dot eyes, long dark hair in a single low braid, wearing a white blouse, a long dark red skirt and a pale blue knitted cardigan
  ANNE: a 45-year-old Turkish mother in 1993, white round head, dot eyes, short wavy brown hair, wearing a flowered short-sleeved blouse and a beige skirt
  BABA: a 48-year-old Turkish father in 1993, white round head, dot eyes, thick black mustache, wearing a short-sleeved checked shirt and grey trousers
  KARDES: a 9-year-old Turkish boy in 1993, white round head, dot eyes, short black hair, wearing a striped t-shirt and shorts
  HOCA: a 55-year-old Turkish semah teacher in 1993, white round head, dot eyes, grey mustache, wearing a white shirt and a dark vest, carrying a long-necked baglama in a cloth case
  EV_SAHIBI: a 60-year-old Turkish woman from Sivas in 1993, white round head, dot eyes, a white headscarf loosely tied, wearing a long floral dress and a knitted vest, warm and motherly
  SEN_YASLI: a 50-year-old Turkish woman today, white round head, dot eyes, shoulder-length dark hair with grey streaks, wearing a modern dark blue coat
youtube:
  title: Eğer 2 Temmuz 1993'te Sivas'ta Semah Dönen Bir Genç Olsaydın?
  description: 'Haziran 1993, Ankara. Annen dolaptan oyalı bir yazma çıkarıyor. Sen on yedi yaşındasın ve ilk kez Sivas''a, Pir Sultan Abdal Şenliği''nde semah dönmeye gidiyorsun. Üç gün sonra o yazmayı ağzına tutup bir binadan kaçacaksın.


    Bu videoda 2 Temmuz 1993''e, kurgusal bir semahçı kızın gözünden bakıyoruz: şenliğin ilk günü, bir kitap ve bir bildiri etrafında büyüyen gerilim, iptal edilen program, Madımak Oteli''nin önünde saatlerce büyüyen kalabalık, iki bina arasındaki dar boşluk, ertesi sabah açıklanan bilanço, otuz yılı aşan yargı süreci ve bugün her 2 Temmuz''da yapılan anma.


    Bu videoyu o gün hayatını kaybeden otuz beş kişinin anısına saygıyla hazırladık.


    Not: Ana karakter, ailesi, semah hocası ve ev sahibi kurgusaldır. Olaylar, saatler ve rakamlar açıklamadaki kaynaklara dayanır; kaynaklar farklı saat ya da rakam verdiğinde bunu videoda belirttik. Olayların nedeni üzerine tartışan iki anlatıyı da aktardık. Videoda kimse isimle suçlanmamaktadır; yargı kararlarını olduğu gibi aktardık. Görseller ve seslendirme yapay zekâ ile üretilmiştir.


    #1993 #Sivas #Madımak #2Temmuz #YakınTarih #Türkiye'
